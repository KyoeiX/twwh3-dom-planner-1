<style>

adient(90deg,#730c08,#260302);border-bottom:1px solid #b72b23;padding:8px 10px;color:#fff2c5;font:900 14px var(--title);letter-spacing:.35px;min-width:0}.armyHead .cost{color:#ffdc71}.armyHead.over .cost,.remain.neg{color:var(--bad)}.armyHead.activeSlot{box-shadow:inset 0 0 0 2px #f2d073}.armyHead small{font-family:var(--ui);color:#d7b470;font-weight:900;margin-left:8px}.headRight{display:flex;align-items:center;gap:8px;flex-shrink:0}.clearBtn{width:26px;height:24px;border:1px solid #7c321d;background:#1a0302;color:#d8b16d;font-weight:900;cursor:pointer}.clearBtn:hover{color:#fff;outline:1px solid #d6a64c}.unitSlots{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;align-content:start;min-width:0}.card{height:76px;border:1px solid #7e1510;background:linear-gradient(180deg,#2a0807,#060202);position:relative;padding:15px 4px 4px;text-align:center;cursor:pointer;box-shadow:inset 0 0 12px #000;min-width:0}.card:hover,.card.sel,.rosterCard:hover,.rosterCard.sel{outline:2px solid #f0c56e}.cost{position:absolute;left:4px;top:2px;color:#ffdc7b;font-size:11px;font-weight:900}.unitIcon{width:34px;height:34px;margin:3px auto 2px;border-radius:50%;border:1px solid #b9873b;background:#080303;display:grid;place-items:center;color:var(--bone)}.unitIcon svg{width:21px;height:21px;fill:currentColor}.card.ror .unitIcon,.rosterCard.ror .unitIcon{color:var(--purple);border-color:#a77cff;box-shadow:0 0 8px #7e43d255,inset 0 0 12px #000}.code{font:900 11px Arial Black,Arial,sans-serif;color:#fff9eb;letter-spacing:.35px;text-shadow:0 1px #000}.empty{height:76px;border:1px solid #4d0907;background:linear-gradient(180deg,#21050788,#06020288)}.roster{padding:10px;min-height:790px;min-width:0;background:linear-gradient(180deg,#210504,#080202)}.rosterHead{height:42px;display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px;background:linear-gradient(90deg,#5b0d09,#190302);border:1px solid #8d2019;padding:6px}.search{width:160px;max-width:60%;background:#090202;border:1px solid #8b4a1c;color:#fff2c5;padding:5px 7px;font:800 12px var(--ui)}.search::placeholder{color:#9e8569}.groups{height:708px;overflow:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:#b66b25 #130302}.groups::-webkit-scrollbar,.modalCard::-webkit-scrollbar{width:10px}.groups::-webkit-scrollbar-track,.modalCard::-webkit-scrollbar-track{background:#130302;border-left:1px solid #45100b}.groups::-webkit-scrollbar-thumb,.modalCard::-webkit-scrollbar-thumb{background:linear-gradient(#d6a64c,#6b2812);border:1px solid #220604;border-radius:8px}.group{margin-bottom:10px}.groupTitle{font-family:var(--title);background:linear-gradient(90deg,#7b120d,#280303);border:1px solid #b72b23;color:#ffe3a3;padding:6px 8px;font-size:13px;font-weight:900;letter-spacing:.4px}.rosterGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:8px 0}.rosterCard{height:82px;border:1px solid #74120e;background:linear-gradient(180deg,#2a0907,#080202);padding:15px 4px 4px;text-align:center;position:relative;cursor:pointer;min-width:0}.rosterCard .unitIcon{width:35px;height:35px}.rosterCard .code{font-size:10px}.status{height:20px;color:#d8c49e;font-size:12px;margin-top:5px}.status.bad{color:var(--bad)}.status.ok{color:var(--ok)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalCard{width:min(900px,calc(100vw - 40px));max-height:88vh;overflow:auto;background:#120303;border:2px solid #9e231b;padding:18px;box-shadow:0 20px 80px #000;scrollbar-width:thin;scrollbar-color:#b66b25 #130302}.modalCard textarea{width:100%;height:260px;background:#050101;color:#f6e2bd;border:1px solid #8b2119;padding:10px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.modalPrimary{border:1px solid #b66b25;background:linear-gradient(#5b160e,#180302);color:#fff0c1;padding:9px 14px;font-family:var(--ui);font-weight:900;cursor:pointer}.armyPick{display:grid;gap:8px}.armyPickRow{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 38px;gap:8px}.armyPickBtn{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;text-align:left;padding:11px;border-left:1px solid #81201a;border-right:1px solid #81201a;border-top:0!important;border-bottom:0!important;background:linear-gradient(90deg,#2b0504,#5d0a07);color:#f5dfb7;cursor:pointer;min-width:0}.armyPickBtn.active{outline:0;box-shadow:inset 4px 0 0 var(--gold),inset -4px 0 0 rgba(214,166,76,.35)}.armyPickBtn b{font-family:var(--title);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-underline-offset:4px}.armyPickBtn span{color:#ffd77d;font-size:12px}.miniAct{border:1px solid #71301d;background:#1a0302;color:#d8b16d;font-weight:900;cursor:pointer}.miniAct:hover{color:#fff;outline:1px solid #d6a64c}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalHead h2{font-family:var(--title);margin:0;color:#fff3cc}.closeX{width:38px;height:38px;border-radius:50%;border:1px solid #b66b25;background:#240403;color:#fff;font-size:22px;cursor:pointer}@media(max-width:1500px){.wrap{grid-template-columns:minmax(240px,300px) minmax(420px,1fr) minmax(320px,480px)}}@media(max-width:1120px){.wrap{grid-template-columns:minmax(0,1fr);width:calc(100vw - 18px);gap:10px}.side,.roster{min-height:auto}.unitPanel{min-height:420px}.groups{height:520px}.top{position:static}.globalControls{position:absolute}.title{padding:10px 54px;font-size:21px}.topEdit{grid-template-columns:1fr}.validBadge{justify-content:center}}@media(max-width:620px){.title{padding:9px 34px;font-size:18px}.globalBtn{font-size:16px}.armyPickRow{grid-template-columns:minmax(0,1fr) 34px 34px 34px}.armyPickBtn{grid-template-columns:1fr}.armyPickBtn span{display:block}.search{width:130px}.top{padding-left:50px;padding-right:50px}}
</style>

<body>
<header class="top"><div class="topInner"><div class="title">Khorne Army Builder</div><div class="topEdit"><input id="armyName" class="nameInput"><div id="warnings" class="validBadge"></div></div></div></header><div class="globalControls"><button id="savedBtn" class="globalBtn" title="Saved Armies">☰</button></div>
<div class="wrap">
<aside class="panel side"><section class="unitPanel"><div class="detailSwitch"><button id="detailA">I</button><button id="detailB">II</button></div><div id="unitDetails"></div></section><p class="hint">Hover previews. Single-click locks. Double-click roster adds. Double-click army removes.</p></aside>
<main class="panel builder"><section class="slots"><div id="mainBox" class="armyBox"><div id="mainHead" class="armyHead"><span>▣ Main Army <small id="mainLeft"></small></span><span class="headRight"><span class="cost"></span><button id="clearMain" class="clearBtn" title="Clear Main Army">×</button></span></div><div id="mainSlots" class="unitSlots"></div></div><div id="reinfBox" class="armyBox"><div id="reinfHead" class="armyHead"><span>▣ Reinforcing Army <small id="reinfLeft"></small></span><span class="headRight"><span class="cost"></span><button id="clearReinf" class="clearBtn" title="Clear Reinforcing Army">×</button></span></div><div id="reinfSlots" class="unitSlots"></div></div></section><div id="status" class="status"></div></main>
<aside class="panel roster"><div class="rosterHead"><input id="search" class="search" placeholder="Search"></div><div id="groups" class="groups"></div></aside>
</div>
<div id="exportModal" class="modal"><div class="modalCard"><div class="modalHead"><h2>Export Army JSON</h2><button id="exportClose" class="closeX">×</button></div><textarea id="modalText"></textarea><div class="row"><button id="exportClose2" class="modalPrimary">Close</button></div></div></div>
<div id="armyModal" class="modal"><div class="modalCard"><div class="modalHead"><h2>Saved Armies</h2><button id="armyClose" class="closeX">×</button></div><div id="armyPick" class="armyPick"></div><div class="row"><button id="modalNewArmy" class="modalPrimary">＋ New Army</button></div></div></div>
<script>
const CAP=9000,MAX_UNITS=20,STORE='khorneArmyBuilderV6',DETAIL_STORE='khorneDetailStyle';
const ICON={crown:'M128 40a12 12 0 1 1 0 24a12 12 0 0 1 0-24Zm-92 40a12 12 0 1 1 0 24a12 12 0 0 1 0-24Zm184 0a12 12 0 1 1 0 24a12 12 0 0 1 0-24ZM48 108l40 44l40-72l40 72l40-44l-15 84H63z',hero:'M128 24l32 56l64 8l-46 44l12 64l-62-32l-62 32l12-64l-46-44l64-8z',sword:'M216 32h-64l-64 84l-16-16l-24 24l84 84l24-24l-16-16l84-64V32zM40 204l32-32l12 12l-32 32z',shield:'M48 56h160v56c0 72-56 104-80 112c-24-8-80-40-80-112z',halberd:'M28 204l104-104l-28-28l32-32c20 30 48 50 88 60l-80 80c-10-38-30-66-60-88L40 216z',dog:'M48 128l16-88l44 16h40l44-16l16 88l-32-40v88a24 24 0 0 1-24 24H104a24 24 0 0 1-24-24V88zM104 144a8 8 0 1 0 0-16a8 8 0 0 0 0 16Zm48 0a8 8 0 1 0 0-16a8 8 0 0 0 0 16Z',horse:'M48 144l80-52V48c56 0 96 40 96 88c0 52-44 88-96 88c-24 0-48-8-68-24l32-44c28 12 76 6 76-36a56 56 0 0 1-56 56l-28 40',bomb:'M96 72h64v20a72 72 0 1 1-64 0zM136 56c4-24 20-40 40-40c28 0 36 40 64 40',rocket:'M128 24c40 32 64 80 32 160H96C64 104 88 56 128 24Zm0 72a12 12 0 1 0 0-24a12 12 0 0 0 0 24ZM96 184l-32 24l-16-56l24-32m88 64l32 24l16-56l-24-32',wing:'M32 140c60-8 76-56 88-108c28 48 20 112-12 156c-30-10-54-24-76-48Zm104 40c28-56 40-108 8-156c52 18 76 70 80 128c-28 20-58 28-88 28'};
const LOADOUT_DB={arb_fh:{id:'arb_fh',n:'Arbaal the Undefeated (Flesh Hound)',c:2350,g:'Lords',t:['Frenzy','Fear'],s:'Custom loadout · Arbaal + Flesh Hound'},kar_no_fs:{id:'kar_no_fs',n:'Karanak, no Foe-Seeker/Talon',c:1700,g:'Heroes',t:['Assassin','Howl'],s:'Custom stripped kit'}};
const REF={arb_fh:['Arbaal the Undefeated (Flesh Hound)',2350],kar_no_fs:['Karanak, no Foe-Seeker/Talon',1700],hell:['Hellforged Bellowers',1600],wh:['Chaos Warhounds',450],mar:['Marauders of Khorne',400],kg:['Khorngors',725],hal:['Chaos Warriors Halberds',900],ckl:['Chaos Knights Lances',1400],ck:['Chaos Knights of Khorne',1400],fh:['Flesh Hounds',750],bt:['Knights of the Brazen Throne',1900],fur:['Chaos Furies',650],sg:['Soul Grinder',1750],rhd:['Hounds of the Blood Hunt',1000],cw:['Chaos Warriors of Khorne',800],for:['Forsaken of Khorne',800],min:['Minotaurs of Khorne',1350]};
const RID={arb_fh:'arb_fh',kar_no_fs:'kar_no_fs',hell:'wh3_dlc26_kho_veh_skullcannon_ror',wh:'wh3_main_kho_inf_chaos_warhounds_0',mar:'wh3_dlc20_chs_inf_chaos_marauders_mkho',kg:'wh3_dlc26_kho_inf_khorngors',hal:'wh3_main_kho_inf_chaos_warriors_1',ckl:'wh3_dlc20_chs_cav_chaos_knights_mkho_lances',ck:'wh3_dlc20_chs_cav_chaos_knights_mkho',fh:'wh3_main_kho_inf_flesh_hounds_of_khorne_0',bt:'wh3_dlc20_kho_cav_skullcrushers_mkho_ror',fur:'wh3_main_kho_inf_chaos_furies_0',sg:'wh3_main_kho_mon_soul_grinder_0',rhd:'wh3_twa10_kho_inf_flesh_hounds_of_khorne_ror',cw:'wh3_main_kho_inf_chaos_warriors_0',for:'wh3_dlc20_chs_inf_forsaken_mkho',min:'wh3_main_kho_mon_khornataurs_0'};
function unit(k){return{id:uuid(),rid:RID[k],n:REF[k][0],c:REF[k][1]}}
const PRESETS=[{name:'Army #1 Baseline',main:['arb_fh','kar_no_fs','hell','wh','mar','kg','kg','hal'],reinf:['ckl','fh','bt','fh','fur','sg','kg','mar']},{name:'Army #2 Durable',main:['arb_fh','kar_no_fs','hell','hal','hal','cw','kg'],reinf:['ck','bt','rhd','fh','fur','sg','kg','mar','mar']},{name:'Army #3 No-KG',main:['arb_fh','hell','hal','hal','hal','cw','for','fh'],reinf:['ck','kar_no_fs','bt','rhd','fh','sg','wh']},{name:'Army #4 Main Minotaurs',main:['arb_fh','hell','min','hal','cw','fh','for','wh'],reinf:['ck','bt','rhd','sg','fh','fur','kg','mar','mar']}].map(a=>({...a,id:uuid(),custom:false,main:a.main.map(unit),reinf:a.reinf.map(unit)}));
let roster=[],state=load(),active=0,dest='main',selected=null,preview=null;
function uuid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Math.random().toString(36).slice(2)+Date.now()}
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(PRESETS)}catch{return structuredClone(PRESETS)}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function sum(arr){return arr.reduce((a,b)=>a+(+b.c||0),0)}
function esc(s){return String(s).replace(/[&<>']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[m]))}
function coin(n){return `🪙 ${n}`}
function msg(t,cls=''){const e=document.getElementById('status');e.className='status '+cls;e.textContent=t}
function findRoster(u){let id=u&&u.rid||u&&u.id;return roster.find(r=>r.id===id)||LOADOUT_DB[id]||roster.find(r=>r.n===u.n)||null}
function findArmyUnit(id){for(const slot of ['main','reinf']){let i=state[active][slot].findIndex(u=>u.id===id);if(i>=0)return{slot,i,u:state[active][slot][i]}}return null}
function groupOf(u){const r=findRoster(u)||u;return r.g||''}
function isLord(u){return groupOf(u)==='Lords'}
function isCharacter(u){let g=groupOf(u);return g==='Lords'||g==='Heroes'}
function isRor(u){return /\b(Hellforged|Brazen|Blood Hunt|Slaughtergard|Berserkers|Behemoth|Bloody Fist|Heralds|Host)\b/i.test(u.n)||/_ror/.test(u.rid||u.id||'')}
function iconKey(u){const r=findRoster(u)||u,g=r.g||'',s=((u.n||'')+' '+g+' '+((r.t||[]).join(' '))).toLowerCase();if(g==='Lords')return'crown';if(g==='Heroes')return s.includes('karanak')?'dog':'hero';if(s.includes('furies')||s.includes('flying'))return'wing';if(s.includes('hound')||s.includes('warhound')||s.includes('karanak'))return'dog';if(s.includes('knight')||s.includes('crusher')||s.includes('chariot')||s.includes('cavalry'))return'horse';if(s.includes('bellow')||s.includes('skullcannon')||s.includes('cannon'))return'rocket';if(s.includes('soul grinder')||s.includes('bloodthirster')||s.includes('minotaur')||s.includes('monster')||s.includes('beast'))return'bomb';if(s.includes('halberd'))return'halberd';if(s.includes('warrior')||s.includes('marauder')||s.includes('chosen'))return'shield';return'sword'}
function iconSvg(k){return `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${ICON[k]||ICON.sword}"/></svg>`}
function code(n){return n.replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/ig,' ').split(/\s+/).filter(w=>w&&!['of','the','and','to','with'].includes(w.toLowerCase())).map(w=>w[0]).join('').slice(0,4).toUpperCase()||'K'}
function selectUnit(u){selected=u;preview=null;renderDetails();highlightSelected()}
function previewUnit(u){preview=u;renderDetails()}
function clearPreview(){preview=null;renderDetails();highlightSelected()}
function highlightSelected(){document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));if(selected)document.querySelectorAll(`[data-sel="${CSS.escape(selected.id||selected.rid||selected.n)}"]`).forEach(x=>x.classList.add('sel'))}
function detailsStats(r){if(!r||!r.s)return'<div class="hint">No stat details stored.</div>';let parts=r.s.split('·').map(x=>x.trim()).filter(Boolean);return '<div class="stats">'+parts.map(p=>{let m=p.match(/^([^0-9+-]+)\s*(.*)$/);return `<b>${esc((m&&m[1]||p).trim())}</b><span>${esc((m&&m[2]||'').trim())}</span>`}).join('')+'</div>'}
function setSelectedLoadout(next){let loc=findArmyUnit(selected&&selected.id);if(!loc||!next)return;state[active][loc.slot][loc.i]={...loc.u,rid:next.id,n:next.n,c:next.c};selected=state[active][loc.slot][loc.i];save();render();selectUnit(selected)}
function loadoutPanel(u){let loc=findArmyUnit(u&&u.id),n=(u.n||'').toLowerCase(),rid=(u.rid||findRoster(u)?.id||u.id);if(!loc||!isCharacter(u))return'';if(n.includes('arbaal')){let checked=rid==='arb_fh';return `<div class="loadout"><div class="loadTitle">Loadout / Mount</div><label class="loadCheck"><input type="checkbox" id="arbaalMount" ${checked?'checked':''}><span><b>Flesh Hound mount</b> +400</span></label></div>`}if(n.includes('karanak')){let checked=rid==='wh3_pro12_kho_cha_karanak';return `<div class="loadout"><div class="loadTitle">Loadout / Abilities</div><label class="loadCheck"><input type="checkbox" id="karanakFull" ${checked?'checked':''}><span><b>Full kit</b> +250</span></label></div>`}return `<div class="loadout"><div class="loadTitle">Loadout</div><div class="loadNote">No editable package defined yet.</div></div>`}
function bindLoadoutControls(){let ar=document.getElementById('arbaalMount');if(ar)ar.onchange=e=>setSelectedLoadout(e.target.checked?LOADOUT_DB.arb_fh:roster.find(x=>x.id==='wh3_dlc26_kho_cha_arbaal'));let ka=document.getElementById('karanakFull');if(ka)ka.onchange=e=>setSelectedLoadout(e.target.checked?roster.find(x=>x.id==='wh3_pro12_kho_cha_karanak'):LOADOUT_DB.kar_no_fs)}
function renderDetails(){const box=document.getElementById('unitDetails'),u=preview||selected;if(!u){box.innerHTML='<p class="hint">Hover or click a unit.</p>';return}const r=findRoster(u)||u;box.innerHTML=`<div class="detailHero"><div class="detailNameBar"><div class="unitName">${esc(u.n||r.n)}</div></div><div class="detailBody"><div class="metaRow"><span class="unitCost">${coin(u.c||r.c)}</span><span class="unitCat">${esc(r.g||'')}</span></div><div class="divider"></div>${loadoutPanel(u)}<div class="tags">${(r.t||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${isRor(u)?'<span class="tag">RoR / Unique</span>':''}</div><div class="divider"></div>${detailsStats(r)}</div></div>`;bindLoadoutControls()}
function unitCard(u,i,slot){let r=isRor(u);return `<div class="card ${r?'ror':''}" data-i="${i}" data-slot="${slot}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click remove"><span class="cost">${u.c}</span><div class="unitIcon">${iconSvg(iconKey(u))}</div><div class="code">${code(u.n)}</div></div>`}
function renderArmyPicker(){let box=document.getElementById('armyPick');box.innerHTML=state.map((a,i)=>`<div class="armyPickRow"><button class="armyPickBtn ${i===active?'active':''}" data-i="${i}"><b>${esc(a.name)}</b><span>Main ${sum(a.main)}/9000</span><span>Reinf ${sum(a.reinf)}/9000</span></button><button class="miniAct" data-copy="${i}" title="Copy">⧉</button><button class="miniAct" data-dup="${i}" title="Duplicate">＋</button><button class="miniAct" data-del="${i}" title="Delete">×</button></div>`).join('');box.querySelectorAll('.armyPickBtn').forEach(b=>b.onclick=()=>{active=+b.dataset.i;document.getElementById('armyModal').classList.remove('open');render()});box.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyArmy(+b.dataset.copy));box.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>duplicateArmy(+b.dataset.dup));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteArmy(+b.dataset.del))}
function copyArmy(i){txt.value=JSON.stringify(state[i],null,2);exportModal.classList.add('open');navigator.clipboard?.writeText(txt.value);msg('Copied army JSON','ok')}
function duplicateArmy(i){let a=structuredClone(state[i]);a.id=uuid();a.name+=' copy';a.custom=true;a.main=a.main.map(u=>({...u,id:uuid()}));a.reinf=a.reinf.map(u=>({...u,id:uuid()}));state.push(a);active=state.length-1;save();renderArmyPicker();render();msg('Duplicated army','ok')}
function deleteArmy(i){if(state.length<=1){alert('Cannot delete the last army.');return}let name=state[i].name;if(!confirm(`Delete "${name}"?`))return;state.splice(i,1);if(i<active)active--;else if(i===active)active=Math.max(0,active-1);selected=null;save();renderArmyPicker();render();msg('Deleted army','ok')}
function validate(a){let out=[],lords=a.main.filter(isLord).length;if(a.main.length===0){out.push({t:'Select a Lord to begin.',c:'soft'});return out}if(sum(a.main)>CAP)out.push({t:'Main Army exceeds 9000.',c:'bad'});if(sum(a.reinf)>CAP)out.push({t:'Reinforcing Army exceeds 9000.',c:'bad'});if(a.main.length>MAX_UNITS)out.push({t:'Main Army exceeds 20 units.',c:'bad'});if(a.reinf.length>MAX_UNITS)out.push({t:'Reinforcing Army exceeds 20 units.',c:'bad'});if(lords===0)out.push({t:'Lord required in Main Army.',c:'bad'});if(lords>1)out.push({t:'Only one Lord allowed in Main Army.',c:'bad'});if(a.reinf.some(isLord))out.push({t:'Lord placed in Reinforcing Army.',c:'bad'});let seen=new Set(),dup=false;[...a.main,...a.reinf].forEach(u=>{let k=findRoster(u)?.id||u.rid||u.n;if(isRor(u)){if(seen.has(k))dup=true;seen.add(k)}});if(dup)out.push({t:'Duplicate RoR / unique unit.',c:'bad'});return out}
function renderBuild(){let a=state[active];document.getElementById('armyName').value=a.name;for(const slot of ['main','reinf']){let h=document.getElementById(slot==='main'?'mainHead':'reinfHead'),s=sum(a[slot]),rem=CAP-s;h.classList.toggle('over',s>CAP);h.classList.toggle('activeSlot',dest===slot);h.querySelector('.cost').textContent=`${coin(s)} / 9000`;let remEl=document.getElementById(slot==='main'?'mainLeft':'reinfLeft');remEl.textContent=coin(rem);remEl.classList.toggle('neg',rem<0);document.getElementById(slot==='main'?'mainSlots':'reinfSlots').innerHTML=a[slot].map((u,i)=>unitCard(u,i,slot)).join('')+Array.from({length:Math.max(0,20-a[slot].length)},()=>'<div class="empty"></div>').join('')}document.querySelectorAll('.card').forEach(c=>{let u=state[active][c.dataset.slot][+c.dataset.i];c.onclick=e=>{selectUnit(u);e.stopPropagation()};c.onmouseenter=()=>previewUnit(u);c.onmouseleave=clearPreview;c.ondblclick=e=>{state[active][c.dataset.slot].splice(+c.dataset.i,1);save();render();msg('Removed unit','ok');e.stopPropagation()}});let v=validate(a);document.getElementById('warnings').innerHTML=v.length?v.map(x=>`<span class="${x.c}">${esc(x.t)}</span>`).join(' &nbsp; '):'<span class="ok">✓ Army valid</span>'}
function render(){renderBuild();renderRoster();renderDetails();highlightSelected();syncDetailButtons()}
function setDest(d){dest=d;renderBuild();renderDetails()}
function clearSlot(slot){state[active][slot]=[];save();render();msg(`Cleared ${slot==='main'?'Main Army':'Reinforcing Army'}`,'ok')}
function add(u){let a=state[active],arr=a[dest];if(arr.length>=MAX_UNITS){msg(`${dest} already has 20 units`,'bad');return}if(dest==='reinf'&&u.g==='Lords'){msg('Lord should stay in Main Army','bad');return}if(dest==='main'&&u.g==='Lords'&&a.main.some(isLord)){msg('Main Army already has a Lord','bad');return}if(isRor(u)&&[...a.main,...a.reinf].some(x=>(findRoster(x)?.id||x.rid||x.n)===u.id||x.n===u.n)){msg('RoR / unique already used in this army','bad');return}arr.push({id:uuid(),rid:u.id,n:u.n,c:u.c});save();render();selectUnit(arr[arr.length-1]);msg(`Added ${u.n}`,'ok')}
function rosterCard(u){let r=isRor(u);return `<div class="rosterCard ${r?'ror':''}" data-id="${esc(u.id)}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click add"><span class="cost">${u.c}</span><div class="unitIcon">${iconSvg(iconKey(u))}</div><div class="code">${code(u.n)}</div></div>`}
function renderRoster(){let q=(document.getElementById('search').value||'').toLowerCase();let groups=['Lords','Heroes','Infantry','Cavalry & Chariots','Monsters & Beasts','Missile Cavalry & Chariots'];let html='';for(const g of groups){let list=roster.filter(u=>u.g===g&&u.id!=='arb_fh'&&u.id!=='kar_no_fs'&&(!q||(u.n+' '+u.c+' '+(u.t||[]).join(' ')).toLowerCase().includes(q)));if(!list.length)continue;html+=`<section class="group"><div class="groupTitle">${g}</div><div class="rosterGrid">${list.map(rosterCard).join('')}</div></section>`}document.getElementById('groups').innerHTML=html;document.querySelectorAll('.rosterCard').forEach(c=>{let u=roster.find(x=>x.id===c.dataset.id);c.onclick=()=>selectUnit(u);c.onmouseenter=()=>previewUnit(u);c.onmouseleave=clearPreview;c.ondblclick=()=>add(u)})}
function newArmy(){state.push({id:uuid(),name:'New Khorne Army',custom:true,main:[],reinf:[]});active=state.length-1;save();selected=null;renderArmyPicker();render();msg('Created new army','ok')}
function setDetailStyle(style){document.body.classList.toggle('detailB',style==='B');localStorage.setItem(DETAIL_STORE,style);syncDetailButtons()}
function syncDetailButtons(){let style=localStorage.getItem(DETAIL_STORE)||'A';document.getElementById('detailA')?.classList.toggle('on',style!=='B');document.getElementById('detailB')?.classList.toggle('on',style==='B')}
document.body.classList.toggle('detailB',(localStorage.getItem(DETAIL_STORE)||'A')==='B');document.getElementById('detailA').onclick=()=>setDetailStyle('A');document.getElementById('detailB').onclick=()=>setDetailStyle('B');document.getElementById('mainBox').onclick=()=>setDest('main');document.getElementById('reinfBox').onclick=()=>setDest('reinf');document.getElementById('clearMain').onclick=e=>{e.stopPropagation();clearSlot('main')};document.getElementById('clearReinf').onclick=e=>{e.stopPropagation();clearSlot('reinf')};document.getElementById('search').oninput=renderRoster;document.getElementById('armyName').onchange=e=>{state[active].name=e.target.value.trim()||'Untitled Army';save();renderBuild();renderArmyPicker()};document.getElementById('modalNewArmy').onclick=newArmy;document.getElementById('savedBtn').onclick=()=>{renderArmyPicker();document.getElementById('armyModal').classList.add('open')};document.getElementById('armyClose').onclick=()=>document.getElementById('armyModal').classList.remove('open');
const exportModal=document.getElementById('exportModal'),txt=document.getElementById('modalText');document.getElementById('exportClose').onclick=()=>exportModal.classList.remove('open');document.getElementById('exportClose2').onclick=()=>exportModal.classList.remove('open');document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))});
fetch('roster.json').then(r=>r.json()).then(data=>{roster=data.sort((a,b)=>a.c-b.c);selected=roster.find(x=>x.id==='wh3_dlc26_kho_cha_arbaal')||roster[0];render()}).catch(()=>{msg('Roster failed to load','bad');render()});
</script>
</body>
</html>
