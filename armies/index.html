<style>
:root{--gold:#d6a64c;--red:#8b1510;--text:#f5e4c2;--muted:#bca586;--bad:#ff7268;--ok:#86e56a;--purple:#9b66ff;--ui:'Inter',system-ui,sans-serif;--title:'Cinzel',Georgia,serif}*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{min-height:100vh;background:linear-gradient(180deg,rgba(5,1,1,.18),rgba(5,1,1,.35) 42%,rgba(5,1,1,.58)),url('../kyoei_of_khorne_bg.png') center top/cover fixed no-repeat;color:var(--text);font-family:var(--ui);font-weight:700}.uiHidden .wrap{display:none}.top{position:sticky;top:0;z-index:30;min-height:135px;background:linear-gradient(#100d17e8,#050101f5);border-bottom:2px solid #4b0907;display:grid;place-items:center;padding:12px 58px}.topInner{width:min(850px,92vw);display:grid;gap:9px;place-items:center}.title{width:min(620px,88vw);font:900 24px var(--title);letter-spacing:.9px;text-align:center;color:#fff6cf;text-shadow:0 2px #000;background:linear-gradient(90deg,#27100b,#5b2114 50%,#1b0b07);border:2px solid #946027;padding:9px 64px;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}.topEdit{width:min(760px,90vw);display:grid;grid-template-columns:1fr auto;align-items:center;background:linear-gradient(90deg,#220805,#5c1b10 52%,#160403);border-left:2px solid #946027;border-right:2px solid #946027;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);box-shadow:inset 0 0 12px #000}.nameInput{min-width:0;border:0;background:transparent;color:#fff3cc;padding:9px 22px;font:900 16px var(--title);outline:none}.nameInput:focus{background:#000}.validBadge{padding:0 24px 0 12px;font-size:12px;font-weight:900;white-space:nowrap}.ok{color:var(--ok)}.bad,.neg{color:var(--bad)!important}.soft{color:#e8c783}.globalControls{position:fixed;right:14px;top:14px;z-index:50}.globalBtn{width:40px;height:38px;border:1px solid #b66b25;background:linear-gradient(#5b160e,#180302);color:#fff0c1;font:900 20px var(--ui);cursor:pointer;box-shadow:0 4px 16px #000a}.wrap{width:calc(100vw - 24px);max-width:1840px;margin:18px auto 24px;display:grid;grid-template-columns:minmax(260px,330px) minmax(420px,1fr) minmax(340px,620px);gap:12px}.panel{min-width:0;background:transparent;border:0;box-shadow:none}.side{min-height:790px;display:grid;grid-template-rows:1fr;padding:10px}.unitPanel{position:relative;min-height:620px;padding:16px;border:2px solid #555e69;background:radial-gradient(circle at 50% 0,#2f3741,#12151a 46%,#050607);box-shadow:inset 0 0 30px #000}.unitPanel:before{content:"";position:absolute;inset:7px;border:1px solid #727b87;clip-path:polygon(8% 0,92% 0,100% 8%,100% 92%,92% 100%,8% 100%,0 92%,0 8%);pointer-events:none}.unitPanel>*{position:relative;z-index:1}.detailHero{border:1px solid #6d7682;background:linear-gradient(180deg,#07090b,#1c2229 50%,#050607);box-shadow:inset 0 0 20px #000}.detailNameBar{text-align:center;padding:14px 15px 12px;background:linear-gradient(90deg,#090b0e,#2e343c 50%,#090b0e);border-bottom:1px solid #78818d}.unitName{font:900 25px/1.08 var(--title);color:#fff;letter-spacing:.35px;text-shadow:0 2px #000,0 0 9px #7f1f18}.detailBody{padding:14px}.detailTop{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}.detailTop>.imgWrap{width:92px;height:199px;border:1px solid #777f8a;background:#080303;box-shadow:0 4px 12px #000}.metaRow{display:flex;gap:9px;flex-wrap:wrap;color:#e2e8f0;font-size:14px;font-weight:900}.divider{height:1px;background:linear-gradient(90deg,transparent,#87909b,transparent);margin:13px 0}.stats{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;font-size:15px;line-height:1.35}.stats b{color:#e8c783;font-weight:900}.stats span{color:#fff1d0;font-weight:900;text-align:right}.tags{margin:8px 0}.tag{display:inline-block;margin:3px 3px 0;border:1px solid #5e6670;color:#d5b06d;font-size:12px;padding:3px 6px;background:#0b0d10;font-weight:900}.loadout{margin:10px 0;border:1px solid #5e6670;background:#0b0d10;padding:9px}.loadTitle{font-size:13px;color:#ffe2a0;font-weight:900;margin-bottom:6px}.loadCheck{display:flex;align-items:center;gap:8px;border:1px solid #6f321b;background:#160403;padding:8px;margin-top:6px;font-size:13px;color:#e9d5ad;cursor:pointer}.loadCheck input{accent-color:#b9873b}.hint,.loadNote{font-size:12px;color:var(--muted);line-height:1.35;margin:0}.builder{padding:10px;display:grid;grid-template-rows:1fr;min-height:790px}.slots{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;min-height:0}.armyBox{border:2px solid #9f211b;background:#0b0202cc;min-height:0;display:grid;grid-template-rows:auto 1fr;cursor:pointer}.armyBox:hover{box-shadow:inset 0 0 0 1px #d4a04b}.armyHead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#730c08,#260302);border-bottom:1px solid #b72b23;padding:8px 10px;color:#fff2c5;font:900 14px var(--title);letter-spacing:.35px}.armyHead .headCost{color:#ffdc71}.armyHead.over .headCost{color:var(--bad)}.armyHead.activeSlot{box-shadow:inset 0 0 0 2px #f2d073}.armyHead small{font:900 12px var(--ui);color:#d7b470;margin-left:8px}.headRight{display:flex;align-items:center;gap:8px}.clearBtn{width:26px;height:24px;border:1px solid #7c321d;background:#1a0302;color:#d8b16d;font-weight:900;cursor:pointer}.unitSlots{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,60px));justify-content:start;gap:7px;align-content:start}.card,.rosterCard{position:relative;border:1px solid #7e1510;background:linear-gradient(180deg,#2a0807,#060202);cursor:pointer;box-shadow:inset 0 0 12px #000;overflow:hidden;aspect-ratio:60/130}.card{width:60px}.rosterCard{width:64px}.card:after,.rosterCard:after{content:"";position:absolute;inset:1px;z-index:9;border:2px solid transparent;pointer-events:none}.card:hover:after,.card.sel:after,.rosterCard:hover:after,.rosterCard.sel:after{border-color:#f0c56e}.card.ror,.rosterCard.ror{border-color:#8c5cff;box-shadow:0 0 9px #6a37b966,inset 0 0 12px #000}.imgWrap{width:100%;height:100%;display:grid;place-items:center;background:#120303}.unitImg{width:100%;height:100%;object-fit:cover;display:block}.imgFallback{display:none;place-items:center;width:100%;height:100%;font:900 15px var(--title);color:#fff1c9;text-align:center;padding:6px}.noImg .imgFallback{display:grid}.noImg .unitImg{display:none}.empty{width:60px;aspect-ratio:60/130;border:1px solid #4d0907;background:linear-gradient(180deg,#21050788,#06020288)}.roster{padding:10px;min-height:790px;background:transparent;position:relative}.rosterHead{height:42px;display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px;background:transparent;border:0;padding:0}.search{width:160px;max-width:60%;background:#090202;border:1px solid #8b4a1c;color:#fff2c5;padding:5px 7px;font:800 12px var(--ui)}.groups{position:absolute;left:0;right:0;top:50px;bottom:0;height:auto;overflow:auto;padding:0 4px 0 2px;scrollbar-width:thin;scrollbar-color:#b66b25 #130302}.groups::-webkit-scrollbar,.modalCard::-webkit-scrollbar{width:10px}.groups::-webkit-scrollbar-track,.modalCard::-webkit-scrollbar-track{background:#130302;border-left:1px solid #45100b}.groups::-webkit-scrollbar-thumb,.modalCard::-webkit-scrollbar-thumb{background:linear-gradient(#d6a64c,#6b2812);border:1px solid #220604;border-radius:8px}.group{margin-bottom:12px;padding:7px 6px 8px;background:linear-gradient(180deg,rgba(18,3,3,.82),rgba(6,1,1,.72));border:1px solid rgba(183,43,35,.58);box-shadow:inset 0 0 18px #0009,0 8px 18px #0005}.groupTitle{font-family:var(--title);background:linear-gradient(90deg,#7b120d,#280303);border:1px solid #b72b23;color:#ffe3a3;padding:6px 8px;font-size:13px;font-weight:900;letter-spacing:.4px}.rosterGrid{display:grid;grid-template-columns:repeat(auto-fill,64px);justify-content:start;gap:7px;padding:8px 0 0 2px}.status{display:none}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:60;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalCard{width:min(900px,calc(100vw - 40px));max-height:88vh;overflow:auto;background:#120303;border:2px solid #9e231b;padding:18px;box-shadow:0 20px 80px #000;scrollbar-width:thin;scrollbar-color:#b66b25 #130302}.modalCard textarea{width:100%;height:260px;background:#050101;color:#f6e2bd;border:1px solid #8b2119;padding:10px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.modalPrimary{border:1px solid #b66b25;background:linear-gradient(#5b160e,#180302);color:#fff0c1;padding:9px 14px;font-family:var(--ui);font-weight:900;cursor:pointer}.armyPick{display:grid;gap:8px}.armyPickRow{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 38px;gap:8px}.armyPickBtn{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;text-align:left;padding:11px;border-left:1px solid #81201a;border-right:1px solid #81201a;background:linear-gradient(90deg,#2b0504,#5d0a07);color:#f5dfb7;cursor:pointer;min-width:0}.armyPickBtn.active{box-shadow:inset 4px 0 0 var(--gold),inset -4px 0 0 rgba(214,166,76,.35)}.armyPickBtn b{font-family:var(--title);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-underline-offset:4px}.armyPickBtn span{color:#ffd77d;font-size:12px}.miniAct{border:1px solid #71301d;background:#1a0302;color:#d8b16d;font-weight:900;cursor:pointer}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalHead h2{font-family:var(--title);margin:0;color:#fff3cc}.closeX{width:38px;height:38px;border-radius:50%;border:1px solid #b66b25;background:#240403;color:#fff;font-size:22px;cursor:pointer}@media(max-width:1500px){.wrap{grid-template-columns:minmax(240px,300px) minmax(420px,1fr) minmax(320px,480px)}.card,.empty{width:56px}.unitSlots{grid-template-columns:repeat(auto-fill,56px)}.rosterCard{width:60px}.rosterGrid{grid-template-columns:repeat(auto-fill,60px)}}@media(max-width:1120px){.wrap{grid-template-columns:minmax(0,1fr);width:calc(100vw - 18px)}.side,.builder,.roster{min-height:auto}.groups{position:static;height:520px}.top{position:static}.globalControls{position:absolute}.card,.empty{width:60px}.unitSlots{grid-template-columns:repeat(auto-fill,60px)}}@media(max-width:620px){.title{padding:9px 34px;font-size:18px}.top{padding-left:50px;padding-right:50px}.detailTop{grid-template-columns:76px 1fr}.detailTop>.imgWrap{width:76px;height:165px}.armyPickRow{grid-template-columns:minmax(0,1fr) 34px 34px 34px}.armyPickBtn{grid-template-columns:1fr}.armyPickBtn span{display:block}.search{width:130px}.card,.empty{width:52px}.unitSlots{grid-template-columns:repeat(auto-fill,52px)}.rosterCard{width:56px}.rosterGrid{grid-template-columns:repeat(auto-fill,56px)}}
</style>
</head>
<body>
<header class="top"><div class="topInner"><div class="title">Khorne Army Builder</div><div class="topEdit"><input id="armyName" class="nameInput"><div id="warnings" class="validBadge"></div></div></div></header><div class="globalControls"><button id="savedBtn" class="globalBtn" title="Saved Armies">☰</button></div>
<div class="wrap"><aside class="panel side"><section class="unitPanel"><div id="unitDetails"></div></section></aside><main class="panel builder"><section class="slots"><div id="mainBox" class="armyBox"><div id="mainHead" class="armyHead"><span>▣ Main Army <small id="mainLeft"></small></span><span class="headRight"><span class="headCost"></span><button id="clearMain" class="clearBtn" title="Clear Main Army">×</button></span></div><div id="mainSlots" class="unitSlots"></div></div><div id="reinfBox" class="armyBox"><div id="reinfHead" class="armyHead"><span>▣ Reinforcing Army <small id="reinfLeft"></small></span><span class="headRight"><span class="headCost"></span><button id="clearReinf" class="clearBtn" title="Clear Reinforcing Army">×</button></span></div><div id="reinfSlots" class="unitSlots"></div></div></section><div id="status" class="status"></div></main><aside class="panel roster"><div class="rosterHead"><input id="search" class="search" placeholder="Search"></div><div id="groups" class="groups"></div></aside></div>
<div id="exportModal" class="modal"><div class="modalCard"><div class="modalHead"><h2>Export Army JSON</h2><button id="exportClose" class="closeX">×</button></div><textarea id="modalText"></textarea><div class="row"><button id="exportClose2" class="modalPrimary">Close</button></div></div></div>
<div id="armyModal" class="modal"><div class="modalCard"><div class="modalHead"><h2>Saved Armies</h2><button id="armyClose" class="closeX">×</button></div><div id="armyPick" class="armyPick"></div><div class="row"><button id="modalNewArmy" class="modalPrimary">＋ New Army</button></div></div></div>
<script>
const CAP=9000,MAX_UNITS=20,STORE='khorneArmyBuilderV10',IMG_BASE='../khorne_unit_card_images/';
const LOADOUT_DB={arb_fh:{id:'arb_fh',n:'Arbaal the Undefeated (Flesh Hound)',c:2350,g:'Lords',t:['Frenzy','Fear'],s:'Custom loadout · Arbaal + Flesh Hound'},kar_no_fs:{id:'kar_no_fs',n:'Karanak, no Foe-Seeker/Talon',c:1700,g:'Heroes',t:['Assassin','Howl'],s:'Custom stripped kit'}};
const REF={arb_fh:['Arbaal the Undefeated (Flesh Hound)',2350],kar_no_fs:['Karanak, no Foe-Seeker/Talon',1700],hell:['Hellforged Bellowers',1600],wh:['Chaos Warhounds',450],mar:['Marauders of Khorne',400],kg:['Khorngors',725],hal:['Chaos Warriors Halberds',900],ckl:['Chaos Knights Lances',1400],ck:['Chaos Knights of Khorne',1400],fh:['Flesh Hounds',750],bt:['Knights of the Brazen Throne',1900],fur:['Chaos Furies',650],sg:['Soul Grinder',1750],rhd:['Hounds of the Blood Hunt',1000],cw:['Chaos Warriors of Khorne',800],for:['Forsaken of Khorne',800],min:['Minotaurs of Khorne',1350]};
const RID={arb_fh:'arb_fh',kar_no_fs:'kar_no_fs',hell:'wh3_dlc26_kho_veh_skullcannon_ror',wh:'wh3_main_kho_inf_chaos_warhounds_0',mar:'wh3_dlc20_chs_inf_chaos_marauders_mkho',kg:'wh3_dlc26_kho_inf_khorngors',hal:'wh3_main_kho_inf_chaos_warriors_1',ckl:'wh3_dlc20_chs_cav_chaos_knights_mkho_lances',ck:'wh3_dlc20_chs_cav_chaos_knights_mkho',fh:'wh3_main_kho_inf_flesh_hounds_of_khorne_0',bt:'wh3_dlc20_kho_cav_skullcrushers_mkho_ror',fur:'wh3_main_kho_inf_chaos_furies_0',sg:'wh3_main_kho_mon_soul_grinder_0',rhd:'wh3_twa10_kho_inf_flesh_hounds_of_khorne_ror',cw:'wh3_main_kho_inf_chaos_warriors_0',for:'wh3_dlc20_chs_inf_forsaken_mkho',min:'wh3_main_kho_mon_khornataurs_0'};
function uuid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Math.random().toString(36).slice(2)+Date.now()}function unit(k){return{id:uuid(),rid:RID[k],n:REF[k][0],c:REF[k][1]}}
const PRESETS=[{name:'Army #1 Baseline',main:['arb_fh','kar_no_fs','hell','wh','mar','kg','kg','hal'],reinf:['ckl','fh','bt','fh','fur','sg','kg','mar']},{name:'Army #2 Durable',main:['arb_fh','kar_no_fs','hell','hal','hal','cw','kg'],reinf:['ck','bt','rhd','fh','fur','sg','kg','mar','mar']},{name:'Army #3 No-KG',main:['arb_fh','hell','hal','hal','hal','cw','for','fh'],reinf:['ck','kar_no_fs','bt','rhd','fh','sg','wh']},{name:'Army #4 Main Minotaurs',main:['arb_fh','hell','min','hal','cw','fh','for','wh'],reinf:['ck','bt','rhd','sg','fh','fur','kg','mar','mar']}].map(a=>({...a,id:uuid(),custom:false,main:a.main.map(unit),reinf:a.reinf.map(unit)}));
let roster=[],state=load(),active=0,dest='main',selected=null,preview=null;
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(PRESETS)}catch{return structuredClone(PRESETS)}}function save(){localStorage.setItem(STORE,JSON.stringify(state))}function sum(a){return a.reduce((x,u)=>x+(+u.c||0),0)}function esc(s){return String(s).replace(/[&<>']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[m]))}function coin(n){return `🪙 ${n}`}function msg(t,cls=''){statusEl.className='status '+cls;statusEl.textContent=t}
function findRoster(u){let id=u&&u.rid||u&&u.id;return roster.find(r=>r.id===id)||LOADOUT_DB[id]||roster.find(r=>r.n===u.n)||null}function findArmyUnit(id){for(const slot of ['main','reinf']){let i=state[active][slot].findIndex(u=>u.id===id);if(i>=0)return{slot,i,u:state[active][slot][i]}}return null}function groupOf(u){return(findRoster(u)||u).g||''}function isLord(u){return groupOf(u)==='Lords'}function isCharacter(u){let g=groupOf(u);return g==='Lords'||g==='Heroes'}function isRor(u){return /\b(Hellforged|Brazen|Blood Hunt|Slaughtergard|Berserkers|Behemoth|Bloody Fist|Heralds|Host)\b/i.test(u.n)||/_ror/.test(u.rid||u.id||'')}
function slugName(n){return String(n||'unit').toLowerCase().replace(/[’']s\b/g,'_s').replace(/[’']/g,'').replace(/–/g,'-').replace(/[^a-z0-9()_-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'')}
function imageKey(u){let id=u.rid||findRoster(u)?.id||u.id||'';if(id==='arb_fh')return'arbaal_the_undefeated';if(id==='kar_no_fs')return'karanak';let r=findRoster(u)||u;return slugName(r.n||u.n)}
function imgHtml(u){let key=imageKey(u),id=u.rid||findRoster(u)?.id||u.id||'',alt=esc(u.n||findRoster(u)?.n||'unit');let fallback=String(id||key).replace(/'/g,'');let code=(u.n||'Unit').replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/ig,' ').split(/\s+/).filter(w=>w&&!['of','the','and','to','with'].includes(w.toLowerCase())).map(w=>w[0]).join('').slice(0,4).toUpperCase();return `<div class="imgWrap"><img class="unitImg" src="${IMG_BASE}${key}.webp" alt="${alt}" onerror="if(!this.dataset.x){this.dataset.x=1;this.src='${IMG_BASE}${fallback}.png'}else{this.parentElement.classList.add('noImg')}}"><div class="imgFallback">${esc(code||'K')}</div></div>`}
function selectUnit(u){selected=u;preview=null;renderDetails();highlightSelected()}function previewUnit(u){preview=u;renderDetails()}function clearPreview(){preview=null;renderDetails();highlightSelected()}function highlightSelected(){document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));if(selected)document.querySelectorAll(`[data-sel="${CSS.escape(selected.id||selected.rid||selected.n)}"]`).forEach(x=>x.classList.add('sel'))}
function detailsStats(r){if(!r||!r.s)return'<div class="hint">No stat details stored.</div>';let names={Arm:'Armour',Ld:'Leadership',Spd:'Speed',MA:'Melee Attack',MD:'Melee Defence',WS:'Weapon Strength',CB:'Charge Bonus',Rng:'Range'};let parts=r.s.split('·').map(x=>x.trim()).filter(Boolean);return '<div class="stats">'+parts.map(p=>{let m=p.match(/^([^0-9+-]+)\s*(.*)$/),k=(m&&m[1]||p).trim(),v=(m&&m[2]||'').trim();return `<b>${esc(names[k]||k)}</b><span>${esc(v)}</span>`}).join('')+'</div>'}
function setSelectedLoadout(next){let loc=findArmyUnit(selected&&selected.id);if(!loc||!next)return;state[active][loc.slot][loc.i]={...loc.u,rid:next.id,n:next.n,c:next.c};selected=state[active][loc.slot][loc.i];save();render();selectUnit(selected)}
function loadoutPanel(u){let loc=findArmyUnit(u&&u.id),n=(u.n||'').toLowerCase(),rid=(u.rid||findRoster(u)?.id||u.id);if(!loc||!isCharacter(u))return'';if(n.includes('arbaal'))return `<div class="loadout"><div class="loadTitle">Loadout / Mount</div><label class="loadCheck"><input type="checkbox" id="arbaalMount" ${rid==='arb_fh'?'checked':''}><span><b>Flesh Hound mount</b> +400</span></label></div>`;if(n.includes('karanak'))return `<div class="loadout"><div class="loadTitle">Loadout / Abilities</div><label class="loadCheck"><input type="checkbox" id="karanakFull" ${rid==='wh3_pro12_kho_cha_karanak'?'checked':''}><span><b>Full kit</b> +250</span></label></div>`;return `<div class="loadout"><div class="loadTitle">Loadout</div><div class="loadNote">No editable package defined yet.</div></div>`}
function bindLoadoutControls(){let ar=document.getElementById('arbaalMount');if(ar)ar.onchange=e=>setSelectedLoadout(e.target.checked?LOADOUT_DB.arb_fh:roster.find(x=>x.id==='wh3_dlc26_kho_cha_arbaal'));let ka=document.getElementById('karanakFull');if(ka)ka.onchange=e=>setSelectedLoadout(e.target.checked?roster.find(x=>x.id==='wh3_pro12_kho_cha_karanak'):LOADOUT_DB.kar_no_fs)}
function renderDetails(){const u=preview||selected;if(!u){unitDetails.innerHTML='<p class="hint">Hover or click a unit.</p>';return}const r=findRoster(u)||u;unitDetails.innerHTML=`<div class="detailHero"><div class="detailNameBar"><div class="unitName">${esc(u.n||r.n)}</div></div><div class="detailBody"><div class="detailTop">${imgHtml(u)}<div><div class="metaRow"><span>${coin(u.c||r.c)}</span><span>·</span><span>${esc(r.g||'')}</span></div><div class="tags">${(r.t||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${isRor(u)?'<span class="tag">RoR / Unique</span>':''}</div></div></div><div class="divider"></div>${loadoutPanel(u)}<div class="divider"></div>${detailsStats(r)}</div></div>`;bindLoadoutControls()}
function unitCard(u,i,slot){return `<div class="card ${isRor(u)?'ror':''}" data-i="${i}" data-slot="${slot}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click remove">${imgHtml(u)}</div>`}
function rosterCard(u){return `<div class="rosterCard ${isRor(u)?'ror':''}" data-id="${esc(u.id)}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click add">${imgHtml(u)}</div>`}
function renderArmyPicker(){armyPick.innerHTML=state.map((a,i)=>`<div class="armyPickRow"><button class="armyPickBtn ${i===active?'active':''}" data-i="${i}"><b>${esc(a.name)}</b><span>Main ${sum(a.main)}/9000</span><span>Reinf ${sum(a.reinf)}/9000</span></button><button class="miniAct" data-copy="${i}" title="Copy">⧉</button><button class="miniAct" data-dup="${i}" title="Duplicate">＋</button><button class="miniAct" data-del="${i}" title="Delete">×</button></div>`).join('');armyPick.querySelectorAll('.armyPickBtn').forEach(b=>b.onclick=()=>{active=+b.dataset.i;armyModal.classList.remove('open');render()});armyPick.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyArmy(+b.dataset.copy));armyPick.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>duplicateArmy(+b.dataset.dup));armyPick.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteArmy(+b.dataset.del))}
function copyArmy(i){modalText.value=JSON.stringify(state[i],null,2);exportModal.classList.add('open');navigator.clipboard?.writeText(modalText.value);msg('Copied army JSON','ok')}function duplicateArmy(i){let a=structuredClone(state[i]);a.id=uuid();a.name+=' copy';a.custom=true;a.main=a.main.map(u=>({...u,id:uuid()}));a.reinf=a.reinf.map(u=>({...u,id:uuid()}));state.push(a);active=state.length-1;save();renderArmyPicker();render();msg('Duplicated army','ok')}function deleteArmy(i){if(state.length<=1){alert('Cannot delete the last army.');return}if(!confirm(`Delete "${state[i].name}"?`))return;state.splice(i,1);active=Math.max(0,Math.min(active,state.length-1));selected=null;save();renderArmyPicker();render();msg('Deleted army','ok')}
function validate(a){let out=[],lords=a.main.filter(isLord).length;if(a.main.length===0){out.push({t:'Select a Lord to begin.',c:'soft'});return out}if(sum(a.main)>CAP)out.push({t:'Main Army exceeds 9000.',c:'bad'});if(sum(a.reinf)>CAP)out.push({t:'Reinforcing Army exceeds 9000.',c:'bad'});if(a.main.length>MAX_UNITS)out.push({t:'Main Army exceeds 20 units.',c:'bad'});if(a.reinf.length>MAX_UNITS)out.push({t:'Reinforcing Army exceeds 20 units.',c:'bad'});if(lords===0)out.push({t:'Lord required in Main Army.',c:'bad'});if(lords>1)out.push({t:'Only one Lord allowed in Main Army.',c:'bad'});if(a.reinf.some(isLord))out.push({t:'Lord placed in Reinforcing Army.',c:'bad'});let seen=new Set(),dup=false;[...a.main,...a.reinf].forEach(u=>{let k=findRoster(u)?.id||u.rid||u.n;if(isRor(u)){if(seen.has(k))dup=true;seen.add(k)}});if(dup)out.push({t:'Duplicate RoR / unique unit.',c:'bad'});return out}
function renderBuild(){let a=state[active];armyName.value=a.name;for(const slot of ['main','reinf']){let head=document.getElementById(slot==='main'?'mainHead':'reinfHead'),s=sum(a[slot]),rem=CAP-s;head.classList.toggle('over',s>CAP);head.classList.toggle('activeSlot',dest===slot);head.querySelector('.headCost').textContent=`${coin(s)} / 9000`;let remEl=document.getElementById(slot==='main'?'mainLeft':'reinfLeft');remEl.textContent=coin(rem);remEl.classList.toggle('neg',rem<0);document.getElementById(slot==='main'?'mainSlots':'reinfSlots').innerHTML=a[slot].map((u,i)=>unitCard(u,i,slot)).join('')+Array.from({length:Math.max(0,20-a[slot].length)},()=>'<div class="empty"></div>').join('')}document.querySelectorAll('.card').forEach(c=>{let u=state[active][c.dataset.slot][+c.dataset.i];c.onclick=e=>{selectUnit(u);e.stopPropagation()};c.onmouseenter=()=>previewUnit(u);c.onmouseleave=clearPreview;c.ondblclick=e=>{state[active][c.dataset.slot].splice(+c.dataset.i,1);save();render();msg('Removed unit','ok');e.stopPropagation()}});let v=validate(a);warnings.innerHTML=v.length?v.map(x=>`<span class="${x.c}">${esc(x.t)}</span>`).join(' &nbsp; '):'<span class="ok">✓ Army valid</span>'}
function render(){renderBuild();renderRoster();renderDetails();highlightSelected()}function setDest(d){dest=d;renderBuild();renderDetails()}function clearSlot(slot){state[active][slot]=[];save();render();msg(`Cleared ${slot==='main'?'Main Army':'Reinforcing Army'}`,'ok')}
function add(u){let a=state[active],arr=a[dest];if(arr.length>=MAX_UNITS){msg(`${dest} already has 20 units`,'bad');return}if(dest==='reinf'&&u.g==='Lords'){msg('Lord should stay in Main Army','bad');return}if(dest==='main'&&u.g==='Lords'&&a.main.some(isLord)){msg('Main Army already has a Lord','bad');return}if(isRor(u)&&[...a.main,...a.reinf].some(x=>(findRoster(x)?.id||x.rid||x.n)===u.id||x.n===u.n)){msg('RoR / unique already used in this army','bad');return}arr.push({id:uuid(),rid:u.id,n:u.n,c:u.c});save();render();selectUnit(arr[arr.length-1]);msg(`Added ${u.n}`,'ok')}
function renderRoster(){let q=(search.value||'').toLowerCase(),groups=['Lords','Heroes','Infantry','Cavalry & Chariots','Monsters & Beasts','Missile Cavalry & Chariots'];let html='';for(const g of groups){let list=roster.filter(u=>u.g===g&&u.id!=='arb_fh'&&u.id!=='kar_no_fs'&&(!q||(u.n+' '+u.c+' '+(u.t||[]).join(' ')).toLowerCase().includes(q)));if(!list.length)continue;html+=`<section class="group"><div class="groupTitle">${g}</div><div class="rosterGrid">${list.map(rosterCard).join('')}</div></section>`}groupsEl.innerHTML=html;document.querySelectorAll('.rosterCard').forEach(c=>{let u=roster.find(x=>x.id===c.dataset.id);c.onclick=()=>selectUnit(u);c.onmouseenter=()=>previewUnit(u);c.onmouseleave=clearPreview;c.ondblclick=()=>add(u)})}
function newArmy(){state.push({id:uuid(),name:'New Khorne Army',custom:true,main:[],reinf:[]});active=state.length-1;save();selected=null;renderArmyPicker();render();msg('Created new army','ok')}
const mainBox=document.getElementById('mainBox'),reinfBox=document.getElementById('reinfBox'),statusEl=document.getElementById('status'),unitDetails=document.getElementById('unitDetails'),armyModal=document.getElementById('armyModal'),exportModal=document.getElementById('exportModal'),modalText=document.getElementById('modalText'),groupsEl=document.getElementById('groups');
mainBox.onclick=()=>setDest('main');reinfBox.onclick=()=>setDest('reinf');clearMain.onclick=e=>{e.stopPropagation();clearSlot('main')};clearReinf.onclick=e=>{e.stopPropagation();clearSlot('reinf')};search.oninput=renderRoster;armyName.onchange=e=>{state[active].name=e.target.value.trim()||'Untitled Army';save();renderBuild();renderArmyPicker()};modalNewArmy.onclick=newArmy;savedBtn.onclick=()=>{renderArmyPicker();armyModal.classList.add('open')};armyClose.onclick=()=>armyModal.classList.remove('open');exportClose.onclick=()=>exportModal.classList.remove('open');exportClose2.onclick=()=>exportModal.classList.remove('open');document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));document.addEventListener('keydown',e=>{let tag=document.activeElement&&document.activeElement.tagName;if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));if(e.key.toLowerCase()==='u'&&!['INPUT','TEXTAREA'].includes(tag))document.body.classList.toggle('uiHidden')});
fetch('roster.json').then(r=>r.json()).then(data=>{roster=data.sort((a,b)=>a.c-b.c);selected=roster.find(x=>x.id==='wh3_dlc26_kho_cha_arbaal')||roster[0];render()}).catch(()=>{msg('Roster failed to load','bad');render()});
</script>
</body>
