<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khorne Army Builder</title>
<style>
:root{--bg:#060202;--panel:#150302f2;--panel2:#210504f5;--red:#770b07;--red2:#b71b12;--gold:#d6a64c;--gold2:#ffe08a;--line:#a8231c;--text:#f5e4c2;--muted:#bca586;--ok:#86e56a;--bad:#ff7268;--purple:#7e43d2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% -10%,#40335e 0,#1b0710 35%,#050202 76%);color:var(--text);font-family:Georgia,'Times New Roman',serif}.top{height:90px;background:linear-gradient(#11101acc,#050202ef);border-bottom:2px solid #4b0907;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:20}.title{background:linear-gradient(90deg,#27100b,#522014 45%,#1b0b07);border:2px solid #7f4b21;color:#fff3cc;padding:10px 94px;font-size:24px;font-weight:900;text-shadow:0 2px #000;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}.tabs{position:absolute;bottom:-22px;display:flex;gap:18px}.tab{min-width:210px;border:2px solid #a65f21;border-radius:8px;background:linear-gradient(#f4a33a,#8f120b 43%,#330403);color:#fff1bd;box-shadow:inset 0 0 8px #000,0 0 10px #000;font-weight:900}.wrap{width:min(1840px,97vw);margin:48px auto 24px;display:grid;grid-template-columns:330px minmax(620px,1fr)620px;gap:12px}.panel{background:linear-gradient(180deg,#1b0504f3,#080202f5);border:2px solid #8d1b16;box-shadow:0 0 0 1px #260201,0 18px 45px #000a}.side{min-height:790px;display:grid;grid-template-rows:auto minmax(210px,auto) auto 1fr;gap:10px;padding:10px}.sectionTitle,.roster h2{font-size:16px;margin:0 0 8px;color:#fff1bd;letter-spacing:.2px}.armyBtn{width:100%;text-align:left;margin:0 0 8px;padding:10px;border:1px solid #8b1b16;background:linear-gradient(90deg,#310604,#5a0a07);border-radius:0;color:#ead4aa;cursor:pointer}.armyBtn.active{outline:2px solid var(--gold);background:linear-gradient(90deg,#660b07,#9d160e)}.armyBtn b{font-size:14px}.armyBtn .meta{display:flex;justify-content:space-between;color:#f6d174;font-size:12px;margin-top:6px}.addArmy{width:100%;height:42px;border:1px solid #c56a25;background:linear-gradient(#682014,#2b0503);color:#fff;font-size:22px;cursor:pointer}.unitPanel{border:1px solid #8b1b16;background:#090202d8;padding:10px;min-height:330px}.unitTop{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;border-bottom:1px solid #64201c;padding-bottom:10px;margin-bottom:10px}.bigIcon{width:62px;height:62px;border-radius:50%;border:2px solid #b8873b;background:#050202;display:grid;place-items:center;color:#fff1c7;box-shadow:inset 0 0 15px #000}.bigIcon svg{width:38px;height:38px;fill:currentColor}.unitName{font-size:17px;font-weight:900;line-height:1.08;color:#fff4cf}.unitCat{color:#e5b85d;font-size:12px;margin-top:5px}.unitCost{display:inline-block;margin-top:5px;border:1px solid #8c4c1c;background:#2d0906;color:#ffd77d;padding:2px 8px;border-radius:999px;font-weight:900;font-size:12px}.stats{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px}.stats b{color:#d0a454}.tags{margin:8px 0}.tag{display:inline-block;margin:2px 2px 0;border:1px solid #774719;color:#d5b06d;font-size:10px;padding:2px 4px;background:#180503}.hint{font-size:12px;color:var(--muted);line-height:1.35;margin:0}.builder{padding:10px;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}.bar{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:center}.nameInput{background:#0b0202;border:1px solid #8d2019;color:#fff1c8;padding:10px;font:900 18px Georgia}.pill{border:1px solid #8c4c1c;background:#2d0906;color:#ffd77d;padding:8px 10px;font-weight:900;white-space:nowrap}.btn{border:1px solid #b66b25;background:linear-gradient(#5b120c,#180302);color:#fbe0a3;padding:9px 12px;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.24)}.warnings{min-height:30px;border:1px solid #55201b;background:#0a0202;padding:6px 8px;color:#d8c49e;font-size:12px}.warnings .bad{color:var(--bad);font-weight:900}.warnings .ok{color:var(--ok);font-weight:900}.slots{display:grid;grid-template-rows:1fr 1fr;gap:10px}.armyBox{border:2px solid #9f211b;background:#0b0202cc;min-height:318px;display:grid;grid-template-rows:auto 1fr}.armyHead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#730c08,#260302);border-bottom:1px solid #b72b23;padding:8px 10px;color:#fff2c5;font-weight:900}.armyHead .cost{color:#ffdc71}.armyHead.over .cost{color:var(--bad)}.armyHead.activeSlot{box-shadow:inset 0 0 0 2px #f2d073}.armyHead small{color:#d7b470;font-weight:700;margin-left:8px}.unitSlots{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;align-content:start}.card{height:76px;border:1px solid #7e1510;background:linear-gradient(180deg,#2a0807,#060202);position:relative;padding:15px 4px 4px;text-align:center;cursor:pointer;box-shadow:inset 0 0 12px #000}.card:hover,.card.sel{outline:2px solid #f0c56e}.cost{position:absolute;left:4px;top:2px;color:#ffdc7b;font-size:11px;font-weight:900}.unitIcon{width:34px;height:34px;margin:3px auto 2px;border-radius:50%;border:1px solid #b9873b;background:#080303;display:grid;place-items:center;color:#f7e6c2}.unitIcon svg{width:21px;height:21px;fill:currentColor}.code{font:900 11px Arial,sans-serif;color:#fff1c7;letter-spacing:.4px}.rorFlag{position:absolute;right:3px;bottom:3px;width:12px;height:12px;border-radius:50%;background:var(--purple);border:1px solid #e7cdff}.empty{height:76px;border:1px solid #4d0907;background:linear-gradient(180deg,#21050788,#06020288)}.roster{padding:10px;min-height:790px}.tools{display:grid;grid-template-columns:1fr 112px;gap:8px;margin-bottom:10px}.search{background:#090202;border:1px solid #842019;color:#fff2c5;padding:9px;font-weight:800}.dest{display:flex;gap:6px;margin-bottom:8px}.dest button{flex:1}.dest .on{outline:2px solid #f5d16b}.groups{height:700px;overflow:auto;padding-right:4px}.group{margin-bottom:10px}.groupTitle{background:linear-gradient(90deg,#7b120d,#280303);border:1px solid #b72b23;color:#ffe3a3;padding:6px 8px;font-weight:900}.rosterGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:8px 0}.rosterCard{height:82px;border:1px solid #74120e;background:linear-gradient(180deg,#2a0907,#080202);padding:15px 4px 4px;text-align:center;position:relative;cursor:pointer}.rosterCard:hover,.rosterCard.sel{outline:2px solid #e0b14d}.rosterCard .unitIcon{width:35px;height:35px}.rosterCard .code{font-size:10px}.status{height:20px;color:#d8c49e;font-size:12px;margin-top:5px}.status.bad{color:var(--bad)}.status.ok{color:var(--ok)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center}.modal.open{display:flex}.modalCard{width:min(760px,92vw);background:#120303;border:2px solid #9e231b;padding:18px;box-shadow:0 20px 80px #000}.modalCard textarea{width:100%;height:260px;background:#050101;color:#f6e2bd;border:1px solid #8b2119;padding:10px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}@media(max-width:1260px){.wrap{grid-template-columns:1fr}.side,.roster{min-height:auto}.groups{height:520px}.top{position:static}.tabs{display:none}.bar{grid-template-columns:1fr 1fr 1fr}.bar .nameInput{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><div class="title">Khorne Army Builder</div><div class="tabs"><button class="tab">Army Setup</button><button class="tab">Roster Setup</button></div></header>
<div class="wrap">
<aside class="panel side"><div><h2 class="sectionTitle">Saved Armies</h2><div id="armyList"></div><button id="addArmy" class="addArmy">＋</button></div><section class="unitPanel"><h2 class="sectionTitle">Selected Unit</h2><div id="unitDetails"></div></section><p class="hint">Single-click a unit to inspect. Double-click roster cards to add. Double-click army cards to remove. Main/Reinf each cap at 9000 and 20 units.</p></aside>
<main class="panel builder"><div class="bar"><input id="armyName" class="nameInput"><span id="armyTotals" class="pill"></span><button id="copyBtn" class="btn">Copy</button><button id="dupBtn" class="btn">Duplicate</button><button id="resetBtn" class="btn">Reset</button></div><div id="warnings" class="warnings"></div><section class="slots"><div class="armyBox"><div id="mainHead" class="armyHead"><span>▣ Main Army <small id="mainLeft"></small></span><span class="cost"></span></div><div id="mainSlots" class="unitSlots"></div></div><div class="armyBox"><div id="reinfHead" class="armyHead"><span>▣ Reinforcing Army <small id="reinfLeft"></small></span><span class="cost"></span></div><div id="reinfSlots" class="unitSlots"></div></div></section><div id="status" class="status"></div></main>
<aside class="panel roster"><h2>Roster</h2><div class="tools"><input id="search" class="search" placeholder="Search unit / cost / tag"><button id="importBtn" class="btn">Import</button></div><div class="dest"><button id="toMain" class="btn on">Add to Main</button><button id="toReinf" class="btn">Add to Reinf</button></div><div id="groups" class="groups"></div></aside>
</div>
<div id="modal" class="modal"><div class="modalCard"><h2 id="modalTitle">Export</h2><textarea id="modalText"></textarea><div class="row"><button id="modalClose" class="btn">Close</button><button id="modalApply" class="btn">Apply Import</button></div></div></div>
<script>
const CAP=9000,MAX_UNITS=20,STORE='khorneArmyBuilderV2';
const ICON={crown:'M128 40a12 12 0 1 1 0 24a12 12 0 0 1 0-24Zm-92 40a12 12 0 1 1 0 24a12 12 0 0 1 0-24Zm184 0a12 12 0 1 1 0 24a12 12 0 0 1 0-24ZM48 108l40 44l40-72l40 72l40-44l-15 84H63z',hero:'M128 24l32 56l64 8l-46 44l12 64l-62-32l-62 32l12-64l-46-44l64-8z',sword:'M216 32h-64l-64 84l-16-16l-24 24l84 84l24-24l-16-16l84-64V32zM40 204l32-32l12 12l-32 32z',shield:'M48 56h160v56c0 72-56 104-80 112c-24-8-80-40-80-112z',halberd:'M28 204l104-104l-28-28l32-32c20 30 48 50 88 60l-80 80c-10-38-30-66-60-88L40 216z',dog:'M48 128l16-88l44 16h40l44-16l16 88l-32-40v88a24 24 0 0 1-24 24H104a24 24 0 0 1-24-24V88zM104 144a8 8 0 1 0 0-16a8 8 0 0 0 0 16Zm48 0a8 8 0 1 0 0-16a8 8 0 0 0 0 16Z',horse:'M48 144l80-52V48c56 0 96 40 96 88c0 52-44 88-96 88c-24 0-48-8-68-24l32-44c28 12 76 6 76-36a56 56 0 0 1-56 56l-28 40',bomb:'M96 72h64v20a72 72 0 1 1-64 0zM136 56c4-24 20-40 40-40c28 0 36 40 64 40',rocket:'M128 24c40 32 64 80 32 160H96C64 104 88 56 128 24Zm0 72a12 12 0 1 0 0-24a12 12 0 0 0 0 24ZM96 184l-32 24l-16-56l24-32m88 64l32 24l16-56l-24-32',wing:'M32 140c60-8 76-56 88-108c28 48 20 112-12 156c-30-10-54-24-76-48Zm104 40c28-56 40-108 8-156c52 18 76 70 80 128c-28 20-58 28-88 28'};
const PRESETS=[
{name:'Army #1 Baseline',main:[['Arbaal, Flesh Hound',2350],['Karanak, Howl, no Foe-Seeker',1850],['Hellforged Bellowers',1600],['Chaos Warhounds',450],['Marauders of Khorne',400],['Khorngors',725],['Khorngors',725],['Chaos Warriors Halberds',900]],reinf:[['Chaos Knights Lances',1400],['Flesh Hounds',750],['Knights of the Brazen Throne',1900],['Second Flesh Hounds',750],['Chaos Furies',650],['Soul Grinder',1750],['Khorngors',725],['Marauders of Khorne',400]]},
{name:'Army #2 Durable',main:[['Arbaal, Flesh Hound',2350],['Karanak, no Foe-Seeker/Talon',1700],['Hellforged Bellowers',1600],['Chaos Warriors Halberds',900],['Chaos Warriors Halberds',900],['Chaos Warriors of Khorne',800],['Khorngors',725]],reinf:[['Chaos Knights of Khorne',1400],['Knights of the Brazen Throne',1900],['Hounds of the Blood Hunt',1000],['Flesh Hounds',750],['Chaos Furies',650],['Soul Grinder',1750],['Khorngors',725],['Marauders of Khorne',400],['Marauders of Khorne',400]]},
{name:'Army #3 No-KG',main:[['Arbaal, Flesh Hound',2350],['Hellforged Bellowers',1600],['Chaos Warriors Halberds',900],['Chaos Warriors Halberds',900],['Chaos Warriors Halberds',900],['Chaos Warriors of Khorne',800],['Forsaken of Khorne',800],['Flesh Hounds',750]],reinf:[['Chaos Knights of Khorne',1400],['Karanak, no Foe-Seeker/Talon',1700],['Knights of the Brazen Throne',1900],['Hounds of the Blood Hunt',1000],['Flesh Hounds',750],['Soul Grinder',1750],['Chaos Warhounds',450]]},
{name:'Army #4 Main Minotaurs',main:[['Arbaal, Flesh Hound',2350],['Hellforged Bellowers',1600],['Minotaurs of Khorne',1350],['Chaos Warriors Halberds',900],['Chaos Warriors of Khorne',800],['Flesh Hounds',750],['Forsaken of Khorne',800],['Chaos Warhounds',450]],reinf:[['Chaos Knights of Khorne',1400],['Knights of the Brazen Throne',1900],['Hounds of the Blood Hunt',1000],['Soul Grinder',1750],['Flesh Hounds',750],['Chaos Furies',650],['Khorngors',725],['Marauders of Khorne',400],['Marauders of Khorne',400]]}
].map(a=>({...a,id:uuid(),custom:false,main:a.main.map(toUnit),reinf:a.reinf.map(toUnit)}));
let roster=[],state=load(),active=0,dest='main',selected=null;
function uuid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Math.random().toString(36).slice(2)+Date.now()}
function toUnit(x){return{id:uuid(),rid:'manual',n:x[0],c:x[1]}}
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(PRESETS)}catch{return structuredClone(PRESETS)}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function sum(arr){return arr.reduce((a,b)=>a+(+b.c||0),0)}
function esc(s){return String(s).replace(/[&<>']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[m]))}
function msg(t,cls=''){const e=document.getElementById('status');e.className='status '+cls;e.textContent=t}
function findRoster(u){return roster.find(r=>r.id===u.rid)||roster.find(r=>r.n===u.n)||null}
function groupOf(u){const r=findRoster(u)||u;return r.g||''}
function isLord(u){return groupOf(u)==='Lords'}
function isRor(u){return /\b(Hellforged|Brazen|Blood Hunt|Slaughtergard|Berserkers|Behemoth|Bloody Fist|Heralds|Host)\b/i.test(u.n)||/_ror/.test(u.id||'')}
function iconKey(u){const r=findRoster(u)||u,s=((u.n||'')+' '+(r.g||'')+' '+((r.t||[]).join(' '))).toLowerCase();if((r.g||'')==='Lords')return'crown';if((r.g||'')==='Heroes')return s.includes('karanak')?'dog':'hero';if(s.includes('furies')||s.includes('flying'))return'wing';if(s.includes('hound')||s.includes('warhound')||s.includes('karanak'))return'dog';if(s.includes('knight')||s.includes('crusher')||s.includes('chariot')||s.includes('cavalry'))return'horse';if(s.includes('bellow')||s.includes('skullcannon')||s.includes('cannon'))return'rocket';if(s.includes('soul grinder')||s.includes('bloodthirster')||s.includes('minotaur')||s.includes('monster')||s.includes('beast'))return'bomb';if(s.includes('halberd'))return'halberd';if(s.includes('warrior')||s.includes('marauder')||s.includes('chosen'))return'shield';return'sword'}
function iconSvg(k){return `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${ICON[k]||ICON.sword}"/></svg>`}
function code(n){return n.replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/ig,' ').split(/\s+/).filter(w=>w&&!['of','the','and','to','with'].includes(w.toLowerCase())).map(w=>w[0]).join('').slice(0,4).toUpperCase()||'K'}
function selectUnit(u){selected=u;renderDetails();document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));document.querySelectorAll(`[data-sel="${CSS.escape(u.id||u.rid||u.n)}"]`).forEach(x=>x.classList.add('sel'))}
function detailsStats(r){if(!r||!r.s)return'<div class="hint">No stat details stored for this custom/loadout entry.</div>';let parts=r.s.split('·').map(x=>x.trim()).filter(Boolean);return '<div class="stats">'+parts.map(p=>{let m=p.match(/^([^0-9+-]+)\s*(.*)$/);return `<b>${esc((m&&m[1]||p).trim())}</b><span>${esc((m&&m[2]||'').trim())}</span>`}).join('')+'</div>'}
function renderDetails(){const box=document.getElementById('unitDetails');if(!selected){box.innerHTML='<p class="hint">Select any roster or army card to show the unit detail panel.</p>';return}const r=findRoster(selected)||selected;box.innerHTML=`<div class="unitTop"><div class="bigIcon">${iconSvg(iconKey(selected))}</div><div><div class="unitName">${esc(selected.n||r.n)}</div><div class="unitCat">${esc(r.g||'Custom loadout')}</div><span class="unitCost">${selected.c||r.c} gold</span></div></div><div class="tags">${(r.t||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${isRor(selected)?'<span class="tag">RoR / Unique</span>':''}</div>${detailsStats(r)}<p class="hint" style="margin-top:10px">Single-click inspected. Double-click roster adds; double-click army card removes.</p>`}
function unitCard(u,i,slot){return `<div class="card" data-i="${i}" data-slot="${slot}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click remove"><span class="cost">${u.c}</span><div class="unitIcon">${iconSvg(iconKey(u))}</div><div class="code">${code(u.n)}</div>${isRor(u)?'<i class="rorFlag"></i>':''}</div>`}
function renderArmies(){let box=document.getElementById('armyList');box.innerHTML=state.map((a,i)=>`<button class="armyBtn ${i===active?'active':''}" data-i="${i}"><b>${esc(a.name)}</b><div class="meta"><span>M ${sum(a.main)}/9000</span><span>R ${sum(a.reinf)}/9000</span></div></button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()})}
function validate(a){let out=[],lords=a.main.filter(isLord).length;if(sum(a.main)>CAP)out.push('Main army over 9000');if(sum(a.reinf)>CAP)out.push('Reinforcing army over 9000');if(a.main.length>MAX_UNITS)out.push('Main army over 20 units');if(a.reinf.length>MAX_UNITS)out.push('Reinforcing army over 20 units');if(lords===0)out.push('Main army has no lord');if(lords>1)out.push('Main army has more than one lord');if(a.reinf.some(isLord))out.push('Lord placed in reinforcements');let seen=new Set(),dup=false;[...a.main,...a.reinf].forEach(u=>{let k=findRoster(u)?.id||u.n;if(isRor(u)){if(seen.has(k))dup=true;seen.add(k)}});if(dup)out.push('Duplicate RoR/unique unit');return out}
function renderBuild(){let a=state[active];document.getElementById('armyName').value=a.name;let sm=sum(a.main),sr=sum(a.reinf);document.getElementById('armyTotals').textContent=`Main ${sm}/9000 · Reinf ${sr}/9000`;for(const slot of ['main','reinf']){let h=document.getElementById(slot==='main'?'mainHead':'reinfHead'),s=sum(a[slot]);h.classList.toggle('over',s>CAP);h.classList.toggle('activeSlot',dest===slot);h.querySelector('.cost').textContent=`${s} / 9000`;document.getElementById(slot==='main'?'mainLeft':'reinfLeft').textContent=`Left: ${CAP-s}`;document.getElementById(slot==='main'?'mainSlots':'reinfSlots').innerHTML=a[slot].map((u,i)=>unitCard(u,i,slot)).join('')+Array.from({length:Math.max(0,20-a[slot].length)},()=>'<div class="empty"></div>').join('')}document.querySelectorAll('.card').forEach(c=>{c.onclick=()=>selectUnit(state[active][c.dataset.slot][+c.dataset.i]);c.ondblclick=()=>{state[active][c.dataset.slot].splice(+c.dataset.i,1);save();render();msg('Removed unit','ok')}});let v=validate(a);document.getElementById('warnings').innerHTML=v.length?v.map(x=>`<span class="bad">⚠ ${esc(x)}</span>`).join(' &nbsp; '):'<span class="ok">✓ Army rules OK</span>'}
function render(){renderArmies();renderBuild();renderRoster();renderDetails()}
function add(u){let a=state[active],arr=a[dest],total=sum(arr);if(arr.length>=MAX_UNITS){msg(`${dest} already has 20 units`,'bad');return}if(total+u.c>CAP){msg(`Cannot add: ${u.n} makes ${dest} ${total+u.c}/9000`,'bad');return}if(dest==='reinf'&&u.g==='Lords'){msg('Lord should stay in main army','bad');return}if(dest==='main'&&u.g==='Lords'&&a.main.some(isLord)){msg('Main army already has a lord','bad');return}if(isRor(u)&&[...a.main,...a.reinf].some(x=>(findRoster(x)?.id||x.rid||x.n)===u.id||x.n===u.n)){msg('RoR/unique already used in this army','bad');return}arr.push({id:uuid(),rid:u.id,n:u.n,c:u.c});save();render();selectUnit(arr[arr.length-1]);msg(`Added ${u.n} to ${dest}`,'ok')}
function rosterCard(u){return `<div class="rosterCard" data-id="${esc(u.id)}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click add"><span class="cost">${u.c}</span><div class="unitIcon">${iconSvg(iconKey(u))}</div><div class="code">${code(u.n)}</div>${isRor(u)?'<i class="rorFlag"></i>':''}</div>`}
function renderRoster(){let q=(document.getElementById('search').value||'').toLowerCase();let groups=['Lords','Heroes','Infantry','Cavalry & Chariots','Monsters & Beasts','Missile Cavalry & Chariots','Custom Loadouts'];let html='';for(const g of groups){let list=roster.filter(u=>{let custom=['arb_fh','kar_no_fs'].includes(u.id);let group=custom?'Custom Loadouts':u.g;return group===g&&(!q||(u.n+' '+u.c+' '+(u.t||[]).join(' ')).toLowerCase().includes(q))});if(!list.length)continue;html+=`<section class="group"><div class="groupTitle">${g}</div><div class="rosterGrid">${list.map(rosterCard).join('')}</div></section>`}document.getElementById('groups').innerHTML=html;document.querySelectorAll('.rosterCard').forEach(c=>{let u=roster.find(x=>x.id===c.dataset.id);c.onclick=()=>selectUnit(u);c.ondblclick=()=>add(u)})}
document.getElementById('toMain').onclick=()=>{dest='main';document.getElementById('toMain').classList.add('on');document.getElementById('toReinf').classList.remove('on');renderBuild()};document.getElementById('toReinf').onclick=()=>{dest='reinf';document.getElementById('toReinf').classList.add('on');document.getElementById('toMain').classList.remove('on');renderBuild()};document.getElementById('search').oninput=renderRoster;document.getElementById('armyName').onchange=e=>{state[active].name=e.target.value.trim()||'Untitled Army';save();renderArmies()};document.getElementById('addArmy').onclick=()=>{state.push({id:uuid(),name:'New Khorne Army',custom:true,main:[],reinf:[]});active=state.length-1;save();render();msg('Created new army','ok')};document.getElementById('dupBtn').onclick=()=>{let a=structuredClone(state[active]);a.id=uuid();a.name+=' copy';a.custom=true;a.main=a.main.map(u=>({...u,id:uuid()}));a.reinf=a.reinf.map(u=>({...u,id:uuid()}));state.push(a);active=state.length-1;save();render();msg('Duplicated army','ok')};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all armies to defaults?')){state=structuredClone(PRESETS);active=0;save();render();msg('Reset armies','ok')}};
const modal=document.getElementById('modal'),txt=document.getElementById('modalText');document.getElementById('copyBtn').onclick=async()=>{txt.value=JSON.stringify(state[active],null,2);document.getElementById('modalTitle').textContent='Export Army JSON';document.getElementById('modalApply').style.display='none';modal.classList.add('open');try{await navigator.clipboard.writeText(txt.value);msg('Copied army JSON','ok')}catch{}};document.getElementById('importBtn').onclick=()=>{txt.value='';document.getElementById('modalTitle').textContent='Import Army JSON';document.getElementById('modalApply').style.display='inline-block';modal.classList.add('open')};document.getElementById('modalClose').onclick=()=>modal.classList.remove('open');document.getElementById('modalApply').onclick=()=>{try{let a=JSON.parse(txt.value);a.id=uuid();a.custom=true;a.main=a.main||[];a.reinf=a.reinf||[];state.push(a);active=state.length-1;save();modal.classList.remove('open');render();msg('Imported army','ok')}catch(e){msg('Import failed: invalid JSON','bad')}};
fetch('roster.json').then(r=>r.json()).then(data=>{roster=data.sort((a,b)=>a.c-b.c);selected=roster.find(x=>x.id==='arb_fh')||roster[0];render()}).catch(()=>{msg('Roster failed to load','bad');render()});
</script>
</body>
</html>
