<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Khorne Army Builder</title>
<style>
:root{--bg:#060202;--panel:#170302ee;--panel2:#260604f5;--red:#7c0d08;--red2:#b01810;--gold:#d8a94f;--gold2:#ffda84;--line:#b32a22;--text:#f5e5c4;--muted:#bfa98a;--ok:#8ee86d;--bad:#ff7168}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#302140 0,#160609 36%,#040202 78%);color:var(--text);font-family:Georgia,'Times New Roman',serif}.top{height:88px;background:linear-gradient(#121018cc,#050202cc);border-bottom:2px solid #4b0907;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:20}.title{position:relative;background:linear-gradient(90deg,#2b120d,#4a1a10 45%,#1b0b07);border:2px solid #7f4b21;color:#fff4d1;padding:10px 90px;font-size:24px;font-weight:900;text-shadow:0 2px #000;clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%)}.tabs{position:absolute;bottom:-22px;display:flex;gap:18px}.tab{min-width:210px;border:2px solid #a65f21;border-radius:8px;background:linear-gradient(#f4a33a,#8f120b 42%,#3a0504);color:#fff1bd;box-shadow:inset 0 0 8px #000,0 0 10px #000;font-weight:900}.wrap{width:min(1780px,96vw);margin:48px auto 24px;display:grid;grid-template-columns:270px 1fr 610px;gap:12px}.panel{background:linear-gradient(180deg,#1b0504f2,#080202f4);border:2px solid #8f1c17;box-shadow:0 0 0 1px #240201,0 18px 45px #000a}.side{min-height:760px;padding:10px}.side h2,.roster h2{font-size:16px;margin:4px 0 10px;color:#fff1bd}.armyBtn{width:100%;text-align:left;margin:0 0 8px;padding:10px;border:1px solid #8b1b16;background:linear-gradient(90deg,#310604,#5a0a07);border-radius:0;color:#ead4aa}.armyBtn.active{outline:2px solid var(--gold);background:linear-gradient(90deg,#660b07,#9d160e)}.armyBtn .meta{display:flex;justify-content:space-between;color:#f6d174;font-size:12px;margin-top:5px}.addArmy{width:100%;height:42px;border:1px solid #c56a25;background:linear-gradient(#682014,#2b0503);color:#fff;font-size:22px}.builder{padding:10px;display:grid;grid-template-rows:auto 1fr;gap:10px}.bar{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:center}.nameInput{background:#0b0202;border:1px solid #8d2019;color:#fff1c8;padding:10px;font:900 18px Georgia}.pill{border:1px solid #8c4c1c;background:#2d0906;color:#ffd77d;padding:8px 10px;font-weight:900}.btn{border:1px solid #b66b25;background:linear-gradient(#5b120c,#180302);color:#fbe0a3;padding:9px 12px;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.25)}.slots{display:grid;grid-template-rows:1fr 1fr;gap:10px}.armyBox{border:2px solid #9f211b;background:#0b0202cc;min-height:310px;display:grid;grid-template-rows:auto 1fr}.armyHead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#730c08,#260302);border-bottom:1px solid #b72b23;padding:8px 10px;color:#fff2c5;font-weight:900}.armyHead .cost{color:#ffdc71}.armyHead.over .cost{color:var(--bad)}.armyHead.activeSlot{box-shadow:inset 0 0 0 2px #f2d073}.unitSlots{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;align-content:start}.card{min-height:86px;border:1px solid #7e1510;background:linear-gradient(180deg,#2a0807,#060202);position:relative;padding:18px 5px 5px;text-align:center;cursor:pointer;box-shadow:inset 0 0 12px #000}.card:hover{outline:2px solid #f0c56e}.card .cost{position:absolute;left:4px;top:2px;color:#ffdc7b;font-size:12px}.card .code{width:34px;height:34px;margin:5px auto 4px;border-radius:50%;border:1px solid #b9873b;background:#080303;display:grid;place-items:center;font:900 11px Arial;color:#f7e6c2}.card .nm{font-size:11px;line-height:1.05}.empty{height:86px;border:1px solid #4d0907;background:linear-gradient(180deg,#21050788,#06020288)}.roster{padding:10px;min-height:760px}.tools{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-bottom:10px}.search{background:#090202;border:1px solid #842019;color:#fff2c5;padding:9px;font-weight:800}.dest{display:flex;gap:6px}.dest button{flex:1}.dest .on{outline:2px solid #f5d16b}.groups{height:690px;overflow:auto;padding-right:4px}.group{margin-bottom:10px}.groupTitle{background:linear-gradient(90deg,#7b120d,#280303);border:1px solid #b72b23;color:#ffe3a3;padding:6px 8px;font-weight:900}.rosterGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;padding:8px 0}.rosterCard{min-height:94px;border:1px solid #74120e;background:linear-gradient(180deg,#2a0907,#080202);padding:16px 4px 5px;text-align:center;position:relative;cursor:pointer}.rosterCard:hover{outline:2px solid #e0b14d}.rosterCard .cost{position:absolute;top:2px;left:4px;color:#ffdb7c;font-size:12px}.tag{display:inline-block;margin:2px 1px 0;border:1px solid #774719;color:#d5b06d;font-size:9px;padding:1px 3px}.status{height:20px;color:#d8c49e;font-size:12px;margin-top:6px}.bad{color:var(--bad)}.ok{color:var(--ok)}.hint{font-size:12px;color:var(--muted);line-height:1.35;margin-top:12px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center}.modal.open{display:flex}.modalCard{width:min(760px,92vw);background:#120303;border:2px solid #9e231b;padding:18px;box-shadow:0 20px 80px #000}.modalCard textarea{width:100%;height:260px;background:#050101;color:#f6e2bd;border:1px solid #8b2119;padding:10px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}@media(max-width:1200px){.wrap{grid-template-columns:1fr}.side,.roster{min-height:auto}.groups{height:520px}.top{position:static}.tabs{display:none}}
</style>
</head>
<body>
<header class='top'><div class='title'>Khorne Army Builder</div><div class='tabs'><button class='tab'>Army Setup</button><button class='tab'>Roster Setup</button></div></header>
<div class='wrap'>
<aside class='panel side'><h2>Saved Armies</h2><div id='armyList'></div><button id='addArmy' class='addArmy'>＋</button><p class='hint'>Double-click a roster card to add. Double-click a selected army card to remove. Main and Reinforcing Army each cap at 9000.</p></aside>
<main class='panel builder'><div class='bar'><input id='armyName' class='nameInput'><span id='armyTotals' class='pill'></span><button id='copyBtn' class='btn'>Copy</button><button id='dupBtn' class='btn'>Duplicate</button><button id='resetBtn' class='btn'>Reset</button></div><section class='slots'><div class='armyBox'><div id='mainHead' class='armyHead'><span>▣ Main Army</span><span class='cost'></span></div><div id='mainSlots' class='unitSlots'></div></div><div class='armyBox'><div id='reinfHead' class='armyHead'><span>▣ Reinforcing Army</span><span class='cost'></span></div><div id='reinfSlots' class='unitSlots'></div></div></section><div id='status' class='status'></div></main>
<aside class='panel roster'><h2>Roster</h2><div class='tools'><input id='search' class='search' placeholder='Search unit / cost / tag'><button id='importBtn' class='btn'>Import</button></div><div class='dest'><button id='toMain' class='btn on'>Add to Main</button><button id='toReinf' class='btn'>Add to Reinf</button></div><div id='groups' class='groups'></div></aside>
</div>
<div id='modal' class='modal'><div class='modalCard'><h2 id='modalTitle'>Export</h2><textarea id='modalText'></textarea><div class='row'><button id='modalClose' class='btn'>Close</button><button id='modalApply' class='btn'>Apply Import</button></div></div></div>
<script>
const CAP=9000,STORE='khorneArmyBuilderV1';
const PRESETS=[
{name:'Army #1 Baseline',main:[['Arbaal, Flesh Hound',2350],['Karanak, Howl, no Foe-Seeker',1850],['Hellforged Bellowers',1600],['Chaos Warhounds',450],['Marauders of Khorne',400],['Khorngors',725],['Khorngors',725],['Chaos Warriors Halberds',900]],reinf:[['Chaos Knights Lances',1400],['Flesh Hounds',750],['Knights of the Brazen Throne',1900],['Second Flesh Hounds',750],['Chaos Furies',650],['Soul Grinder',1750],['Khorngors',725],['Marauders of Khorne',400]]},
{name:'Army #2 Durable',main:[['Arbaal, Flesh Hound',2350],['Karanak, no Foe-Seeker/Talon',1700],['Hellforged Bellowers',1600],['Chaos Warriors Halberds',900],['Chaos Warriors Halberds',900],['Chaos Warriors of Khorne',800],['Khorngors',725]],reinf:[['Chaos Knights of Khorne',1400],['Knights of the Brazen Throne',1900],['Hounds of the Blood Hunt',1000],['Flesh Hounds',750],['Chaos Furies',650],['Soul Grinder',1750],['Khorngors',725],['Marauders of Khorne',400],['Marauders of Khorne',400]]},
{name:'Army #3 No-KG',main:[['Arbaal, Flesh Hound',2350],['Hellforged Bellowers',1600],['Chaos Warriors Halberds',900],['Chaos Warriors Halberds',900],['Chaos Warriors Halberds',900],['Chaos Warriors of Khorne',800],['Forsaken of Khorne',800],['Flesh Hounds',750]],reinf:[['Chaos Knights of Khorne',1400],['Karanak, no Foe-Seeker/Talon',1700],['Knights of the Brazen Throne',1900],['Hounds of the Blood Hunt',1000],['Flesh Hounds',750],['Soul Grinder',1750],['Chaos Warhounds',450]]},
{name:'Army #4 Main Minotaurs',main:[['Arbaal, Flesh Hound',2350],['Hellforged Bellowers',1600],['Minotaurs of Khorne',1350],['Chaos Warriors Halberds',900],['Chaos Warriors of Khorne',800],['Flesh Hounds',750],['Forsaken of Khorne',800],['Chaos Warhounds',450]],reinf:[['Chaos Knights of Khorne',1400],['Knights of the Brazen Throne',1900],['Hounds of the Blood Hunt',1000],['Soul Grinder',1750],['Flesh Hounds',750],['Chaos Furies',650],['Khorngors',725],['Marauders of Khorne',400],['Marauders of Khorne',400]]}
].map(a=>({...a,id:crypto.randomUUID(),custom:false,main:a.main.map(toUnit),reinf:a.reinf.map(toUnit)}));
let roster=[],state=load(),active=0,dest='main';
function toUnit(x){return{id:crypto.randomUUID(),rid:'manual',n:x[0],c:x[1]}}
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(PRESETS)}catch{return structuredClone(PRESETS)}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function sum(arr){return arr.reduce((a,b)=>a+(+b.c||0),0)}
function code(n){return n.replace(/\([^)]*\)/g,'').split(/\s+/).filter(w=>!['of','the','and','to'].includes(w.toLowerCase())).map(w=>w[0]).join('').slice(0,4).toUpperCase()||'K'}
function isRor(u){return /\b(RoR|Hellforged|Brazen|Blood Hunt|Slaughtergard|Berserkers|Behemoth|Bloody Fist|Heralds|Host)\b/i.test(u.n)||/_ror/.test(u.id||'')}
function esc(s){return String(s).replace(/[&<>']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[m]))}
function msg(t,cls=''){const e=document.getElementById('status');e.className='status '+cls;e.textContent=t}
function card(u,i,slot){return `<div class='card' data-i='${i}' data-slot='${slot}' title='Double-click remove'><span class='cost'>${u.c}</span><div class='code'>${code(u.n)}</div><div class='nm'>${esc(u.n)}</div></div>`}
function renderArmies(){let box=document.getElementById('armyList');box.innerHTML=state.map((a,i)=>`<button class='armyBtn ${i===active?'active':''}' data-i='${i}'><b>${esc(a.name)}</b><div class='meta'><span>M ${sum(a.main)}/9000</span><span>R ${sum(a.reinf)}/9000</span></div></button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()})}
function renderBuild(){let a=state[active];document.getElementById('armyName').value=a.name;let sm=sum(a.main),sr=sum(a.reinf);document.getElementById('armyTotals').textContent=`Main ${sm}/9000 · Reinf ${sr}/9000`;for(const slot of ['main','reinf']){let h=document.getElementById(slot==='main'?'mainHead':'reinfHead'),s=sum(a[slot]);h.classList.toggle('over',s>CAP);h.classList.toggle('activeSlot',dest===slot);h.querySelector('.cost').textContent=`${s} / 9000`;document.getElementById(slot==='main'?'mainSlots':'reinfSlots').innerHTML=a[slot].map((u,i)=>card(u,i,slot)).join('')+Array.from({length:Math.max(0,18-a[slot].length)},()=>'<div class="empty"></div>').join('')}document.querySelectorAll('.card').forEach(c=>c.ondblclick=()=>{state[active][c.dataset.slot].splice(+c.dataset.i,1);save();render();msg('Removed unit','ok')})}
function render(){renderArmies();renderBuild();renderRoster()}
function add(u){let a=state[active],arr=a[dest];let total=sum(arr);if(total+u.c>CAP){msg(`Cannot add: ${u.n} makes ${dest} ${total+u.c}/9000`,'bad');return}if(isRor(u)&&[...a.main,...a.reinf].some(x=>x.rid===u.id||x.n===u.n)){msg('RoR already used in this army','bad');return}arr.push({id:crypto.randomUUID(),rid:u.id,n:u.n,c:u.c});save();render();msg(`Added ${u.n} to ${dest}`,'ok')}
function renderRoster(){let q=(document.getElementById('search').value||'').toLowerCase(),groups=['Lords','Heroes','Infantry','Cavalry & Chariots','Monsters & Beasts','Missile Cavalry & Chariots'];let html='';for(const g of groups){let list=roster.filter(u=>u.g===g&&(!q||(u.n+' '+u.c+' '+(u.t||[]).join(' ')).toLowerCase().includes(q)));if(!list.length)continue;html+=`<section class='group'><div class='groupTitle'>${g}</div><div class='rosterGrid'>`+list.map(u=>`<div class='rosterCard' data-id='${u.id}' title='Double-click add'><span class='cost'>${u.c}</span><div class='code'>${code(u.n)}</div><div class='nm'>${esc(u.n)}</div><div>${(u.t||[]).slice(0,2).map(t=>`<span class='tag'>${esc(t)}</span>`).join('')}</div></div>`).join('')+'</div></section>'}document.getElementById('groups').innerHTML=html;document.querySelectorAll('.rosterCard').forEach(c=>c.ondblclick=()=>add(roster.find(u=>u.id===c.dataset.id)))}
document.getElementById('toMain').onclick=()=>{dest='main';document.getElementById('toMain').classList.add('on');document.getElementById('toReinf').classList.remove('on');renderBuild()};document.getElementById('toReinf').onclick=()=>{dest='reinf';document.getElementById('toReinf').classList.add('on');document.getElementById('toMain').classList.remove('on');renderBuild()};document.getElementById('search').oninput=renderRoster;document.getElementById('armyName').onchange=e=>{state[active].name=e.target.value.trim()||'Untitled Army';save();renderArmies()};document.getElementById('addArmy').onclick=()=>{state.push({id:crypto.randomUUID(),name:'New Khorne Army',custom:true,main:[],reinf:[]});active=state.length-1;save();render();msg('Created new army','ok')};document.getElementById('dupBtn').onclick=()=>{let a=structuredClone(state[active]);a.id=crypto.randomUUID();a.name+=' copy';a.custom=true;a.main=a.main.map(u=>({...u,id:crypto.randomUUID()}));a.reinf=a.reinf.map(u=>({...u,id:crypto.randomUUID()}));state.push(a);active=state.length-1;save();render()};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all armies to defaults?')){state=structuredClone(PRESETS);active=0;save();render()}};
const modal=document.getElementById('modal'),txt=document.getElementById('modalText');document.getElementById('copyBtn').onclick=async()=>{txt.value=JSON.stringify(state[active],null,2);document.getElementById('modalTitle').textContent='Export Army JSON';document.getElementById('modalApply').style.display='none';modal.classList.add('open');try{await navigator.clipboard.writeText(txt.value);msg('Copied army JSON','ok')}catch{}};document.getElementById('importBtn').onclick=()=>{txt.value='';document.getElementById('modalTitle').textContent='Import Army JSON';document.getElementById('modalApply').style.display='inline-block';modal.classList.add('open')};document.getElementById('modalClose').onclick=()=>modal.classList.remove('open');document.getElementById('modalApply').onclick=()=>{try{let a=JSON.parse(txt.value);a.id=crypto.randomUUID();a.custom=true;a.main=a.main||[];a.reinf=a.reinf||[];state.push(a);active=state.length-1;save();modal.classList.remove('open');render();msg('Imported army','ok')}catch(e){msg('Import failed: invalid JSON','bad')}};
fetch('roster.json').then(r=>r.json()).then(data=>{roster=data;render()}).catch(()=>{msg('Roster failed to load','bad');render()});
</script>
</body>
</html>
