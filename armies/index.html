<style>
:root{--bg:#060202;--panel:#150302f2;--red:#770b07;--gold:#d6a64c;--gold2:#ffe08a;--line:#a8231c;--text:#f5e4c2;--muted:#bca586;--bone:#f4ead6;--ok:#86e56a;--bad:#ff7268;--purple:#7e43d2;--font-ui:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;--font-title:'Cinzel','Palatino Linotype',Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% -10%,#40335e 0,#1b0710 35%,#050202 76%);color:var(--text);font-family:var(--font-ui);font-weight:600}.top{height:82px;background:linear-gradient(#11101acc,#050202ef);border-bottom:2px solid #4b0907;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:20}.title{font-family:var(--font-title);background:linear-gradient(90deg,#27100b,#522014 45%,#1b0b07);border:2px solid #7f4b21;color:#fff3cc;padding:10px 94px;font-size:24px;font-weight:900;text-shadow:0 2px #000;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);letter-spacing:.9px}.globalControls{position:fixed;right:14px;top:14px;z-index:40;display:flex;gap:8px}.globalBtn{height:38px;min-width:40px;border:1px solid #b66b25;background:linear-gradient(#5b160e,#180302);color:#fff0c1;font-family:var(--font-ui);font-weight:900;cursor:pointer;box-shadow:0 4px 16px #000a}.globalBtn.small{font-size:22px;line-height:1}.wrap{width:min(1840px,97vw);margin:28px auto 24px;display:grid;grid-template-columns:330px minmax(620px,1fr)620px;gap:12px}.panel{background:linear-gradient(180deg,#1b0504f3,#080202f5);border:2px solid #8d1b16;box-shadow:0 0 0 1px #260201,0 18px 45px #000a}.side{min-height:790px;display:grid;grid-template-rows:1fr auto;gap:10px;padding:10px}.sectionTitle,.roster h2{font-family:var(--font-title);font-size:15px;margin:0;color:#fff1bd;letter-spacing:.5px}.unitPanel{border:1px solid #8b1b16;background:#090202d8;padding:10px;min-height:620px}.unitTop{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;border-bottom:1px solid #64201c;padding-bottom:10px;margin-bottom:10px}.bigIcon{width:64px;height:64px;border-radius:50%;border:2px solid #b8873b;background:#050202;display:grid;place-items:center;color:var(--bone);box-shadow:inset 0 0 15px #000}.bigIcon svg{width:38px;height:38px;fill:currentColor}.unitName{font-family:var(--font-title);font-size:17px;font-weight:900;line-height:1.08;color:#fff4cf}.unitCat{color:#e5b85d;font-size:12px;margin-top:5px;font-weight:800}.unitSource{color:#cbb593;font-size:11px;margin-top:3px}.unitCost{display:inline-block;margin-top:6px;border:1px solid #8c4c1c;background:#2d0906;color:#ffd77d;padding:2px 8px;border-radius:999px;font-weight:900;font-size:12px}.stats{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px}.stats b{color:#d0a454}.tags{margin:8px 0}.tag{display:inline-block;margin:2px 2px 0;border:1px solid #774719;color:#d5b06d;font-size:10px;padding:2px 4px;background:#180503;font-weight:800}.loadout{margin:10px 0;border:1px solid #5f1b17;background:#0b0202;padding:8px}.loadTitle{font-size:12px;color:#ffe2a0;font-weight:900;margin-bottom:6px}.loadCheck{display:flex;align-items:center;gap:8px;border:1px solid #6f321b;background:#160403;padding:7px;margin-top:6px;font-size:12px;color:#e9d5ad;cursor:pointer}.loadCheck input{accent-color:#b9873b}.loadCheck b{color:#ffe2a0}.loadNote{font-size:11px;color:#bca586;margin-top:6px;line-height:1.35}.detailActions{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}.detailAdd{width:100%;padding:8px}.hint{font-size:12px;color:var(--muted);line-height:1.35;margin:0}.builder{padding:10px;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.bar{display:grid;grid-template-columns:minmax(250px,1fr) auto auto auto;gap:8px;align-items:start}.titleStack{display:grid;gap:5px}.nameInput{background:#0b0202;border:1px solid #8d2019;color:#fff1c8;padding:10px;font:900 18px var(--font-title)}.validBadge{min-height:26px;border:1px solid #55201b;background:linear-gradient(90deg,#0a0202,#1a0504);padding:5px 8px;color:#d8c49e;font-size:12px}.validBadge .bad{color:var(--bad);font-weight:900}.validBadge .ok{color:var(--ok);font-weight:900}.validBadge .soft{color:#e8c783;font-weight:900}.pill{border:1px solid #8c4c1c;background:#2d0906;color:#ffd77d;padding:8px 10px;font-weight:900;white-space:nowrap}.btn{border:1px solid #b66b25;background:linear-gradient(#5b120c,#180302);color:#fbe0a3;padding:9px 12px;font-family:var(--font-ui);font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.24)}.slots{display:grid;grid-template-rows:1fr 1fr;gap:10px}.armyBox{border:2px solid #9f211b;background:#0b0202cc;min-height:318px;display:grid;grid-template-rows:auto 1fr;cursor:pointer}.armyBox:hover{box-shadow:inset 0 0 0 1px #d4a04b}.armyHead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#730c08,#260302);border-bottom:1px solid #b72b23;padding:8px 10px;color:#fff2c5;font-family:var(--font-title);font-weight:900;font-size:14px;letter-spacing:.35px}.armyHead .cost{color:#ffdc71}.armyHead.over .cost{color:var(--bad)}.armyHead.activeSlot{box-shadow:inset 0 0 0 2px #f2d073}.armyHead small{font-family:var(--font-ui);color:#d7b470;font-weight:800;margin-left:8px}.headRight{display:flex;align-items:center;gap:8px}.clearBtn{width:26px;height:24px;border:1px solid #7c321d;background:#1a0302;color:#d8b16d;font-weight:900;cursor:pointer;font-family:Arial,sans-serif}.clearBtn:hover{color:#fff;outline:1px solid #d6a64c}.unitSlots{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;align-content:start}.card{height:76px;border:1px solid #7e1510;background:linear-gradient(180deg,#2a0807,#060202);position:relative;padding:15px 4px 4px;text-align:center;cursor:pointer;box-shadow:inset 0 0 12px #000}.card:hover,.card.sel{outline:2px solid #f0c56e}.cost{position:absolute;left:4px;top:2px;color:#ffdc7b;font-size:11px;font-weight:900}.unitIcon{width:34px;height:34px;margin:3px auto 2px;border-radius:50%;border:1px solid #b9873b;background:#080303;display:grid;place-items:center;color:var(--bone)}.unitIcon svg{width:21px;height:21px;fill:currentColor}.code{font:900 11px Arial Black,Arial,sans-serif;color:#fff9eb;letter-spacing:.35px;text-shadow:0 1px #000}.rorFlag{position:absolute;right:3px;bottom:3px;width:12px;height:12px;border-radius:50%;background:var(--purple);border:1px solid #e7cdff}.empty{height:76px;border:1px solid #4d0907;background:linear-gradient(180deg,#21050788,#06020288)}.roster{padding:10px;min-height:790px}.rosterHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.search{width:160px;background:#090202;border:1px solid #622019;color:#fff2c5;padding:5px 7px;font-size:12px;font-family:var(--font-ui);font-weight:800}.search::placeholder{color:#9e8569}.groups{height:732px;overflow:auto;padding-right:4px}.group{margin-bottom:10px}.groupTitle{font-family:var(--font-title);background:linear-gradient(90deg,#7b120d,#280303);border:1px solid #b72b23;color:#ffe3a3;padding:6px 8px;font-size:13px;font-weight:900;letter-spacing:.4px}.rosterGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:8px 0}.rosterCard{height:82px;border:1px solid #74120e;background:linear-gradient(180deg,#2a0907,#080202);padding:15px 4px 4px;text-align:center;position:relative;cursor:pointer}.rosterCard:hover,.rosterCard.sel{outline:2px solid #e0b14d}.rosterCard .unitIcon{width:35px;height:35px}.rosterCard .code{font-size:10px}.status{height:20px;color:#d8c49e;font-size:12px;margin-top:5px}.status.bad{color:var(--bad)}.status.ok{color:var(--ok)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalCard{width:min(820px,92vw);max-height:88vh;overflow:auto;background:#120303;border:2px solid #9e231b;padding:18px;box-shadow:0 20px 80px #000}.modalCard textarea{width:100%;height:260px;background:#050101;color:#f6e2bd;border:1px solid #8b2119;padding:10px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.armyPick{display:grid;gap:8px}.armyPickBtn{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;padding:11px;border:1px solid #81201a;background:linear-gradient(90deg,#2b0504,#5d0a07);color:#f5dfb7;cursor:pointer}.armyPickBtn.active{outline:2px solid var(--gold)}.armyPickBtn b{font-family:var(--font-title);font-size:15px}.armyPickBtn span{color:#ffd77d;font-size:12px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalHead h2{font-family:var(--font-title);margin:0}.closeX{width:38px;height:38px;border-radius:50%;border:1px solid #b66b25;background:#240403;color:#fff;font-size:22px;cursor:pointer}@media(max-width:1260px){.wrap{grid-template-columns:1fr}.side,.roster{min-height:auto}.groups{height:520px}.top{position:static}.bar{grid-template-columns:1fr 1fr 1fr}.bar .titleStack{grid-column:1/-1}.globalControls{position:absolute}}
</style>
</head>
<body>
<header class="top"><div class="title">Khorne Army Builder</div></header><div class="globalControls"><button id="savedBtn" class="globalBtn">Saved Armies</button><button id="addArmy" class="globalBtn small" title="New army">＋</button></div>
<div class="wrap">
<aside class="panel side"><section class="unitPanel"><h2 class="sectionTitle">Selected Unit</h2><div id="unitDetails"></div></section><p class="hint">Hover any card to preview details. Single-click locks the detail card. Double-click roster cards to add. Double-click army cards to remove.</p></aside>
<main class="panel builder"><div class="bar"><div class="titleStack"><input id="armyName" class="nameInput"><div id="warnings" class="validBadge"></div></div><span id="armyTotals" class="pill"></span><button id="copyBtn" class="btn">Copy</button><button id="dupBtn" class="btn">Duplicate</button></div><section class="slots"><div id="mainBox" class="armyBox"><div id="mainHead" class="armyHead"><span>▣ Main Army <small id="mainLeft"></small></span><span class="headRight"><span class="cost"></span><button id="clearMain" class="clearBtn" title="Clear Main Army">×</button></span></div><div id="mainSlots" class="unitSlots"></div></div><div id="reinfBox" class="armyBox"><div id="reinfHead" class="armyHead"><span>▣ Reinforcing Army <small id="reinfLeft"></small></span><span class="headRight"><span class="cost"></span><button id="clearReinf" class="clearBtn" title="Clear Reinforcing Army">×</button></span></div><div id="reinfSlots" class="unitSlots"></div></div></section><div id="status" class="status"></div></main>
<aside class="panel roster"><div class="rosterHead"><h2>Roster</h2><input id="search" class="search" placeholder="Search"></div><div id="groups" class="groups"></div></aside>
</div>
<div id="exportModal" class="modal"><div class="modalCard"><div class="modalHead"><h2>Export Army JSON</h2><button id="exportClose" class="closeX">×</button></div><textarea id="modalText"></textarea><div class="row"><button id="exportClose2" class="btn">Close</button></div></div></div>
<div id="armyModal" class="modal"><div class="modalCard"><div class="modalHead"><h2>Saved Armies</h2><button id="armyClose" class="closeX">×</button></div><div id="armyPick" class="armyPick"></div><div class="row"><button id="modalNewArmy" class="btn">＋ New Army</button></div></div></div>
<script>
const CAP=9000,MAX_UNITS=20,STORE='khorneArmyBuilderV4';
const ICON={crown:'M128 40a12 12 0 1 1 0 24a12 12 0 0 1 0-24Zm-92 40a12 12 0 1 1 0 24a12 12 0 0 1 0-24Zm184 0a12 12 0 1 1 0 24a12 12 0 0 1 0-24ZM48 108l40 44l40-72l40 72l40-44l-15 84H63z',hero:'M128 24l32 56l64 8l-46 44l12 64l-62-32l-62 32l12-64l-46-44l64-8z',sword:'M216 32h-64l-64 84l-16-16l-24 24l84 84l24-24l-16-16l84-64V32zM40 204l32-32l12 12l-32 32z',shield:'M48 56h160v56c0 72-56 104-80 112c-24-8-80-40-80-112z',halberd:'M28 204l104-104l-28-28l32-32c20 30 48 50 88 60l-80 80c-10-38-30-66-60-88L40 216z',dog:'M48 128l16-88l44 16h40l44-16l16 88l-32-40v88a24 24 0 0 1-24 24H104a24 24 0 0 1-24-24V88zM104 144a8 8 0 1 0 0-16a8 8 0 0 0 0 16Zm48 0a8 8 0 1 0 0-16a8 8 0 0 0 0 16Z',horse:'M48 144l80-52V48c56 0 96 40 96 88c0 52-44 88-96 88c-24 0-48-8-68-24l32-44c28 12 76 6 76-36a56 56 0 0 1-56 56l-28 40',bomb:'M96 72h64v20a72 72 0 1 1-64 0zM136 56c4-24 20-40 40-40c28 0 36 40 64 40',rocket:'M128 24c40 32 64 80 32 160H96C64 104 88 56 128 24Zm0 72a12 12 0 1 0 0-24a12 12 0 0 0 0 24ZM96 184l-32 24l-16-56l24-32m88 64l32 24l16-56l-24-32',wing:'M32 140c60-8 76-56 88-108c28 48 20 112-12 156c-30-10-54-24-76-48Zm104 40c28-56 40-108 8-156c52 18 76 70 80 128c-28 20-58 28-88 28'};
const LOADOUT_DB={arb_fh:{id:'arb_fh',n:'Arbaal the Undefeated (Flesh Hound)',c:2350,g:'Lords',t:['Frenzy','Fear'],s:'Custom loadout · Arbaal + Flesh Hound'},kar_no_fs:{id:'kar_no_fs',n:'Karanak, no Foe-Seeker/Talon',c:1700,g:'Heroes',t:['Assassin','Howl'],s:'Custom stripped kit'}};
const REF={arb_fh:['Arbaal the Undefeated (Flesh Hound)',2350],kar_no_fs:['Karanak, no Foe-Seeker/Talon',1700],hell:['Hellforged Bellowers',1600],wh:['Chaos Warhounds',450],mar:['Marauders of Khorne',400],kg:['Khorngors',725],hal:['Chaos Warriors Halberds',900],ckl:['Chaos Knights Lances',1400],ck:['Chaos Knights of Khorne',1400],fh:['Flesh Hounds',750],bt:['Knights of the Brazen Throne',1900],fur:['Chaos Furies',650],sg:['Soul Grinder',1750],rhd:['Hounds of the Blood Hunt',1000],cw:['Chaos Warriors of Khorne',800],for:['Forsaken of Khorne',800],min:['Minotaurs of Khorne',1350]};
const RID={arb_fh:'arb_fh',kar_no_fs:'kar_no_fs',hell:'wh3_dlc26_kho_veh_skullcannon_ror',wh:'wh3_main_kho_inf_chaos_warhounds_0',mar:'wh3_dlc20_chs_inf_chaos_marauders_mkho',kg:'wh3_dlc26_kho_inf_khorngors',hal:'wh3_main_kho_inf_chaos_warriors_1',ckl:'wh3_dlc20_chs_cav_chaos_knights_mkho_lances',ck:'wh3_dlc20_chs_cav_chaos_knights_mkho',fh:'wh3_main_kho_inf_flesh_hounds_of_khorne_0',bt:'wh3_dlc20_kho_cav_skullcrushers_mkho_ror',fur:'wh3_main_kho_inf_chaos_furies_0',sg:'wh3_main_kho_mon_soul_grinder_0',rhd:'wh3_twa10_kho_inf_flesh_hounds_of_khorne_ror',cw:'wh3_main_kho_inf_chaos_warriors_0',for:'wh3_dlc20_chs_inf_forsaken_mkho',min:'wh3_main_kho_mon_khornataurs_0'};
function unit(k){return{id:uuid(),rid:RID[k],n:REF[k][0],c:REF[k][1]}}
const PRESETS=[
{name:'Army #1 Baseline',main:['arb_fh','kar_no_fs','hell','wh','mar','kg','kg','hal'],reinf:['ckl','fh','bt','fh','fur','sg','kg','mar']},
{name:'Army #2 Durable',main:['arb_fh','kar_no_fs','hell','hal','hal','cw','kg'],reinf:['ck','bt','rhd','fh','fur','sg','kg','mar','mar']},
{name:'Army #3 No-KG',main:['arb_fh','hell','hal','hal','hal','cw','for','fh'],reinf:['ck','kar_no_fs','bt','rhd','fh','sg','wh']},
{name:'Army #4 Main Minotaurs',main:['arb_fh','hell','min','hal','cw','fh','for','wh'],reinf:['ck','bt','rhd','sg','fh','fur','kg','mar','mar']}
].map(a=>({...a,id:uuid(),custom:false,main:a.main.map(unit),reinf:a.reinf.map(unit)}));
let roster=[],state=load(),active=0,dest='main',selected=null,selectedSource='Selected',preview=null,previewSource='Preview';
function uuid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Math.random().toString(36).slice(2)+Date.now()}
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(PRESETS)}catch{return structuredClone(PRESETS)}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function sum(arr){return arr.reduce((a,b)=>a+(+b.c||0),0)}
function esc(s){return String(s).replace(/[&<>']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[m]))}
function msg(t,cls=''){const e=document.getElementById('status');e.className='status '+cls;e.textContent=t}
function findRoster(u){let id=u&&u.rid||u&&u.id;return roster.find(r=>r.id===id)||LOADOUT_DB[id]||roster.find(r=>r.n===u.n)||null}
function findArmyUnit(id){for(const slot of ['main','reinf']){let i=state[active][slot].findIndex(u=>u.id===id);if(i>=0)return{slot,i,u:state[active][slot][i]}}return null}
function groupOf(u){const r=findRoster(u)||u;return r.g||''}
function isLord(u){return groupOf(u)==='Lords'}
function isCharacter(u){let g=groupOf(u);return g==='Lords'||g==='Heroes'}
function isRor(u){return /\b(Hellforged|Brazen|Blood Hunt|Slaughtergard|Berserkers|Behemoth|Bloody Fist|Heralds|Host)\b/i.test(u.n)||/_ror/.test(u.rid||u.id||'')}
function iconKey(u){const r=findRoster(u)||u,g=r.g||'',s=((u.n||'')+' '+g+' '+((r.t||[]).join(' '))).toLowerCase();if(g==='Lords')return'crown';if(g==='Heroes')return s.includes('karanak')?'dog':'hero';if(s.includes('furies')||s.includes('flying'))return'wing';if(s.includes('hound')||s.includes('warhound')||s.includes('karanak'))return'dog';if(s.includes('knight')||s.includes('crusher')||s.includes('chariot')||s.includes('cavalry'))return'horse';if(s.includes('bellow')||s.includes('skullcannon')||s.includes('cannon'))return'rocket';if(s.includes('soul grinder')||s.includes('bloodthirster')||s.includes('minotaur')||s.includes('monster')||s.includes('beast'))return'bomb';if(s.includes('halberd'))return'halberd';if(s.includes('warrior')||s.includes('marauder')||s.includes('chosen'))return'shield';return'sword'}
function iconSvg(k){return `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${ICON[k]||ICON.sword}"/></svg>`}
function code(n){return n.replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/ig,' ').split(/\s+/).filter(w=>w&&!['of','the','and','to','with'].includes(w.toLowerCase())).map(w=>w[0]).join('').slice(0,4).toUpperCase()||'K'}
function selectUnit(u,src){selected=u;selectedSource=src||'Selected';preview=null;renderDetails();highlightSelected()}
function previewUnit(u,src){preview=u;previewSource=src||'Preview';renderDetails()}
function clearPreview(){preview=null;renderDetails();highlightSelected()}
function highlightSelected(){document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));if(selected)document.querySelectorAll(`[data-sel="${CSS.escape(selected.id||selected.rid||selected.n)}"]`).forEach(x=>x.classList.add('sel'))}
function detailsStats(r){if(!r||!r.s)return'<div class="hint">No stat details stored for this custom/loadout entry.</div>';let parts=r.s.split('·').map(x=>x.trim()).filter(Boolean);return '<div class="stats">'+parts.map(p=>{let m=p.match(/^([^0-9+-]+)\s*(.*)$/);return `<b>${esc((m&&m[1]||p).trim())}</b><span>${esc((m&&m[2]||'').trim())}</span>`}).join('')+'</div>'}
function setSelectedLoadout(next){let loc=findArmyUnit(selected&&selected.id);if(!loc)return;state[active][loc.slot][loc.i]={...loc.u,rid:next.id,n:next.n,c:next.c};selected=state[active][loc.slot][loc.i];save();render();selectUnit(selected,loc.slot==='main'?'Main Army':'Reinforcing Army')}
function loadoutPanel(u){let loc=findArmyUnit(u&&u.id),n=(u.n||'').toLowerCase(),rid=(u.rid||findRoster(u)?.id||u.id);if(!loc||!isCharacter(u))return'';if(n.includes('arbaal')){let checked=rid==='arb_fh';return `<div class="loadout"><div class="loadTitle">Loadout / Mount</div><label class="loadCheck"><input type="checkbox" id="arbaalMount" ${checked?'checked':''}><span><b>Flesh Hound mount</b> +400 gold</span></label><div class="loadNote">Unchecked: Arbaal base 1950. Checked: mounted loadout 2350.</div></div>`}if(n.includes('karanak')){let checked=rid==='wh3_pro12_kho_cha_karanak';return `<div class="loadout"><div class="loadTitle">Loadout / Abilities</div><label class="loadCheck"><input type="checkbox" id="karanakFull" ${checked?'checked':''}><span><b>Full kit</b> +250 gold</span></label><div class="loadNote">Unchecked: stripped Karanak 1700. Checked: full Karanak 1950.</div></div>`}return `<div class="loadout"><div class="loadTitle">Loadout / Abilities</div><div class="loadNote">No editable mount or ability package defined yet for this character.</div></div>`}
function bindLoadoutControls(){let ar=document.getElementById('arbaalMount');if(ar)ar.onchange=e=>setSelectedLoadout(e.target.checked?LOADOUT_DB.arb_fh:roster.find(x=>x.id==='wh3_dlc26_kho_cha_arbaal'));let ka=document.getElementById('karanakFull');if(ka)ka.onchange=e=>setSelectedLoadout(e.target.checked?roster.find(x=>x.id==='wh3_pro12_kho_cha_karanak'):LOADOUT_DB.kar_no_fs)}
function detailAddObject(u){const r=findRoster(u);if(r)return r;return{id:u.rid||u.id||u.n,n:u.n,c:u.c,g:u.g||'',t:u.t||[]}}
function renderDetails(){const box=document.getElementById('unitDetails'),u=preview||selected,src=preview?previewSource:selectedSource;if(!u){box.innerHTML='<p class="hint">Hover a roster/army card to preview. Single-click locks the selected unit here.</p>';return}const r=findRoster(u)||u;box.innerHTML=`<div class="unitTop"><div class="bigIcon">${iconSvg(iconKey(u))}</div><div><div class="unitName">${esc(u.n||r.n)}</div><div class="unitCat">${esc(r.g||'Custom loadout')}</div><div class="unitSource">${esc(src)}</div><span class="unitCost">${u.c||r.c} gold</span></div></div><div class="detailActions"><button id="detailAdd" class="btn detailAdd">Add to ${dest==='main'?'Main Army':'Reinforcing Army'}</button></div>${loadoutPanel(u)}<div class="tags">${(r.t||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${isRor(u)?'<span class="tag">RoR / Unique</span>':''}</div>${detailsStats(r)}<p class="hint" style="margin-top:10px">${preview?'Hover preview. Move away to return to clicked selection.':'Clicked selection locked.'}</p>`;let addBtn=document.getElementById('detailAdd');if(addBtn)addBtn.onclick=()=>add(detailAddObject(u));bindLoadoutControls()}
function unitCard(u,i,slot){return `<div class="card" data-i="${i}" data-slot="${slot}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click remove"><span class="cost">${u.c}</span><div class="unitIcon">${iconSvg(iconKey(u))}</div><div class="code">${code(u.n)}</div>${isRor(u)?'<i class="rorFlag"></i>':''}</div>`}
function renderArmyPicker(){let box=document.getElementById('armyPick');box.innerHTML=state.map((a,i)=>`<button class="armyPickBtn ${i===active?'active':''}" data-i="${i}"><b>${esc(a.name)}</b><span>Main ${sum(a.main)}/9000</span><span>Reinf ${sum(a.reinf)}/9000</span></button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;document.getElementById('armyModal').classList.remove('open');render()})}
function validate(a){let out=[],lords=a.main.filter(isLord).length;if(a.main.length===0){out.push({t:'Select a Lord to begin.',c:'soft'});return out}if(sum(a.main)>CAP)out.push({t:'Main Army exceeds 9000.',c:'bad'});if(sum(a.reinf)>CAP)out.push({t:'Reinforcing Army exceeds 9000.',c:'bad'});if(a.main.length>MAX_UNITS)out.push({t:'Main Army exceeds 20 units.',c:'bad'});if(a.reinf.length>MAX_UNITS)out.push({t:'Reinforcing Army exceeds 20 units.',c:'bad'});if(lords===0)out.push({t:'Lord required in Main Army.',c:'bad'});if(lords>1)out.push({t:'Only one Lord allowed in Main Army.',c:'bad'});if(a.reinf.some(isLord))out.push({t:'Lord placed in Reinforcing Army.',c:'bad'});let seen=new Set(),dup=false;[...a.main,...a.reinf].forEach(u=>{let k=findRoster(u)?.id||u.rid||u.n;if(isRor(u)){if(seen.has(k))dup=true;seen.add(k)}});if(dup)out.push({t:'Duplicate RoR / unique unit.',c:'bad'});return out}
function renderBuild(){let a=state[active];document.getElementById('armyName').value=a.name;let sm=sum(a.main),sr=sum(a.reinf);document.getElementById('armyTotals').textContent=`Target: ${dest==='main'?'Main':'Reinf'} · M ${sm}/9000 · R ${sr}/9000`;for(const slot of ['main','reinf']){let h=document.getElementById(slot==='main'?'mainHead':'reinfHead'),s=sum(a[slot]);h.classList.toggle('over',s>CAP);h.classList.toggle('activeSlot',dest===slot);h.querySelector('.cost').textContent=`${s} / 9000`;document.getElementById(slot==='main'?'mainLeft':'reinfLeft').textContent=`Left: ${CAP-s}`;document.getElementById(slot==='main'?'mainSlots':'reinfSlots').innerHTML=a[slot].map((u,i)=>unitCard(u,i,slot)).join('')+Array.from({length:Math.max(0,20-a[slot].length)},()=>'<div class="empty"></div>').join('')}document.querySelectorAll('.card').forEach(c=>{let u=state[active][c.dataset.slot][+c.dataset.i],src=c.dataset.slot==='main'?'Main Army':'Reinforcing Army';c.onclick=e=>{selectUnit(u,src);e.stopPropagation()};c.onmouseenter=()=>previewUnit(u,src);c.onmouseleave=clearPreview;c.ondblclick=e=>{state[active][c.dataset.slot].splice(+c.dataset.i,1);save();render();msg('Removed unit','ok');e.stopPropagation()}});let v=validate(a);document.getElementById('warnings').innerHTML=v.length?v.map(x=>`<span class="${x.c}">${esc(x.t)}</span>`).join(' &nbsp; '):'<span class="ok">Army valid.</span>'}
function render(){renderBuild();renderRoster();renderDetails();highlightSelected()}
function setDest(d){dest=d;renderBuild();renderDetails()}
function clearSlot(slot){state[active][slot]=[];save();render();msg(`Cleared ${slot==='main'?'Main Army':'Reinforcing Army'}`,'ok')}
function add(u){let a=state[active],arr=a[dest],total=sum(arr);if(arr.length>=MAX_UNITS){msg(`${dest} already has 20 units`,'bad');return}if(total+u.c>CAP){msg(`Cannot add: ${u.n} makes ${dest} ${total+u.c}/9000`,'bad');return}if(dest==='reinf'&&u.g==='Lords'){msg('Lord should stay in Main Army','bad');return}if(dest==='main'&&u.g==='Lords'&&a.main.some(isLord)){msg('Main Army already has a Lord','bad');return}if(isRor(u)&&[...a.main,...a.reinf].some(x=>(findRoster(x)?.id||x.rid||x.n)===u.id||x.n===u.n)){msg('RoR / unique already used in this army','bad');return}arr.push({id:uuid(),rid:u.id,n:u.n,c:u.c});save();render();selectUnit(arr[arr.length-1],dest==='main'?'Main Army':'Reinforcing Army');msg(`Added ${u.n} to ${dest==='main'?'Main Army':'Reinforcing Army'}`,'ok')}
function rosterCard(u){return `<div class="rosterCard" data-id="${esc(u.id)}" data-sel="${esc(u.id)}" title="${esc(u.n)} · double-click add"><span class="cost">${u.c}</span><div class="unitIcon">${iconSvg(iconKey(u))}</div><div class="code">${code(u.n)}</div>${isRor(u)?'<i class="rorFlag"></i>':''}</div>`}
function renderRoster(){let q=(document.getElementById('search').value||'').toLowerCase();let groups=['Lords','Heroes','Infantry','Cavalry & Chariots','Monsters & Beasts','Missile Cavalry & Chariots'];let html='';for(const g of groups){let list=roster.filter(u=>u.g===g&&u.id!=='arb_fh'&&u.id!=='kar_no_fs'&&(!q||(u.n+' '+u.c+' '+(u.t||[]).join(' ')).toLowerCase().includes(q)));if(!list.length)continue;html+=`<section class="group"><div class="groupTitle">${g}</div><div class="rosterGrid">${list.map(rosterCard).join('')}</div></section>`}document.getElementById('groups').innerHTML=html;document.querySelectorAll('.rosterCard').forEach(c=>{let u=roster.find(x=>x.id===c.dataset.id);c.onclick=()=>selectUnit(u,'Roster');c.onmouseenter=()=>previewUnit(u,'Roster');c.onmouseleave=clearPreview;c.ondblclick=()=>add(u)})}
function newArmy(){state.push({id:uuid(),name:'New Khorne Army',custom:true,main:[],reinf:[]});active=state.length-1;save();document.getElementById('armyModal').classList.remove('open');selected=null;render();msg('Created new army','ok')}
document.getElementById('mainBox').onclick=()=>setDest('main');document.getElementById('reinfBox').onclick=()=>setDest('reinf');document.getElementById('clearMain').onclick=e=>{e.stopPropagation();clearSlot('main')};document.getElementById('clearReinf').onclick=e=>{e.stopPropagation();clearSlot('reinf')};document.getElementById('search').oninput=renderRoster;document.getElementById('armyName').onchange=e=>{state[active].name=e.target.value.trim()||'Untitled Army';save();renderBuild()};document.getElementById('addArmy').onclick=newArmy;document.getElementById('modalNewArmy').onclick=newArmy;document.getElementById('savedBtn').onclick=()=>{renderArmyPicker();document.getElementById('armyModal').classList.add('open')};document.getElementById('armyClose').onclick=()=>document.getElementById('armyModal').classList.remove('open');document.getElementById('dupBtn').onclick=()=>{let a=structuredClone(state[active]);a.id=uuid();a.name+=' copy';a.custom=true;a.main=a.main.map(u=>({...u,id:uuid()}));a.reinf=a.reinf.map(u=>({...u,id:uuid()}));state.push(a);active=state.length-1;save();render();msg('Duplicated army','ok')};
const exportModal=document.getElementById('exportModal'),txt=document.getElementById('modalText');document.getElementById('copyBtn').onclick=async()=>{txt.value=JSON.stringify(state[active],null,2);exportModal.classList.add('open');try{await navigator.clipboard.writeText(txt.value);msg('Copied army JSON','ok')}catch{}};document.getElementById('exportClose').onclick=()=>exportModal.classList.remove('open');document.getElementById('exportClose2').onclick=()=>exportModal.classList.remove('open');
fetch('roster.json').then(r=>r.json()).then(data=>{roster=data.sort((a,b)=>a.c-b.c);selected=roster.find(x=>x.id==='wh3_dlc26_kho_cha_arbaal')||roster[0];selectedSource='Roster';render()}).catch(()=>{msg('Roster failed to load','bad');render()});
</script>
</body>
</html>
