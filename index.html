<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khorne vs Skaven Domination Planner</title>
<style>
:root{--panel:rgba(14,10,8,.9);--line:rgba(255,202,93,.72);--text:#f7ead0;--muted:#cdbb9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#32170d,transparent 38%),#080605;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.shell{width:min(1360px,96vw);margin:18px auto;display:grid;grid-template-columns:minmax(560px,1fr)340px;gap:14px}.top{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;align-items:end}h1{margin:0;font-size:clamp(22px,3vw,36px);line-height:1.05}.sub{margin-top:5px;color:var(--muted);font-size:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid rgba(230,187,104,.45);background:#1b120c;color:#f7e1bc;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}button.active,button:hover{background:#6d241f;color:#fff;border-color:#ffd37b}.map{position:relative;aspect-ratio:1086/1448;border:1px solid rgba(255,215,135,.42);border-radius:12px;overflow:hidden;background:#1b130b;box-shadow:0 18px 55px rgba(0,0,0,.5)}.map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.04) contrast(1.04)}.map::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(31,80,20,.08),transparent 22%,transparent 78%,rgba(129,31,23,.1));pointer-events:none;z-index:1}.cap{position:absolute;width:10.45%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.018);box-shadow:inset 0 0 18px rgba(255,255,255,.025);z-index:2;pointer-events:none}.cap.i{left:23.6%;top:52.6%}.cap.ii{left:50.8%;top:52.6%}.cap.iii{left:77.0%;top:52.6%}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}.arrow{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:13 13;filter:drop-shadow(0 2px 3px #000)}.token{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.72);font-size:9px;font-weight:900;color:#fff7df;box-shadow:0 4px 12px rgba(0,0,0,.72),inset 0 0 10px rgba(255,255,255,.16);cursor:help;z-index:5}.token::after{content:attr(data-name) "\A" attr(data-note);white-space:pre-line;position:absolute;left:50%;bottom:122%;transform:translateX(-50%);width:max-content;max-width:260px;opacity:0;background:rgba(5,4,3,.95);border:1px solid rgba(255,206,112,.4);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.25;text-align:left;z-index:50;pointer-events:none}.token:hover{z-index:40;transform:translate(-50%,-50%) scale(1.14)}.token:hover::after{opacity:1}.lord{background:radial-gradient(circle at 35% 30%,#ffcb70,#bd2520 68%,#4d0808)}.hero{background:radial-gradient(circle at 35% 30%,#ffa85d,#7d1718 68%,#2b0505)}.hound{background:radial-gradient(circle at 35% 30%,#fb8d55,#5e2417 72%,#170706)}.infantry{background:radial-gradient(circle at 35% 30%,#ffd984,#8b5a20 70%,#2a1708)}.light{background:radial-gradient(circle at 35% 30%,#ffedb8,#81732b 70%,#28200a)}.artillery{background:radial-gradient(circle at 35% 30%,#fff1aa,#d88725 64%,#4a1608)}.terror{background:radial-gradient(circle at 35% 30%,#f4d28c,#b51d22 64%,#320606);border-color:#ffd064}.monster{background:radial-gradient(circle at 35% 30%,#ffb786,#7f22a8 64%,#250331);border-color:#e1b0ff}.cav{background:radial-gradient(circle at 35% 30%,#c9f1ff,#22618e 70%,#071826)}.flyer{background:radial-gradient(circle at 35% 30%,#eff3ff,#4d5378 70%,#111321)}.skirmish{background:radial-gradient(circle at 35% 30%,#e8ffc4,#447622 70%,#142606)}.reserve{background:rgba(70,70,70,.75);border-style:dashed}.panel{background:var(--panel);border:1px solid rgba(255,206,112,.28);border-radius:12px;padding:14px;height:max-content;box-shadow:0 16px 45px rgba(0,0,0,.35)}.panel h2{margin:0 0 8px;font-size:22px}.summary{font-size:13px;color:#dcc8aa;line-height:1.35;margin-bottom:12px}.unit{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding:7px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);margin-bottom:6px}.mini{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:900}.name{font-size:12px;font-weight:800}.note{font-size:11px;color:#c8b594}.foot{grid-column:1/-1;color:#bca989;font-size:12px}@media(max-width:950px){.shell{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.panel{order:-1}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div><h1>Khorne vs Skaven Domination Planner</h1><div class="sub">Army #1 Ver B: Bellower first, controlled assassin threat, dive after holes open.</div></div><div class="buttons"><button class="active" data-phase="deployment">Deployment</button><button data-phase="start">Start</button><button data-phase="dive">Dive</button></div></header><main class="map"><img class="map-img" src="dommap1.png" alt="Domination map" /><div class="cap i"></div><div class="cap ii"></div><div class="cap iii"></div><svg id="arrows" viewBox="0 0 1086 1448" preserveAspectRatio="none"><defs><marker id="head" markerWidth="18" markerHeight="18" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,6 L0,12 z" fill="rgba(255,202,93,.78)"></path></marker></defs></svg><div id="tokens"></div></main><aside class="panel"><h2 id="phaseTitle"></h2><div id="phaseSummary" class="summary"></div><div id="unitList"></div></aside><div class="foot">Rule: pressure points early, punish Skaven screens with Bellowers, then dive exposed guns/casters. Brazen and Soul Grinder are collapse tools, not first-contact sacrifices.</div></div>
<script>
const W=1086,H=1448;
const phases={deployment:{title:'Deployment Phase',summary:'Set up as controlled pressure. Bellower central, assassins split wide, anti-large ready for lanes.',tokens:[['ARB','Arbaal, Flesh Hound','lord',35,88,'Left threat. Do not over-dive early.'],['KAR','Karanak, Howl, no Foe-Seeker','hero',65,88,'Right threat. Net/silence exposed support.'],['HB','Hellforged Bellowers','artillery',50,91,'Main-army screen punishment.'],['WH','Chaos Warhounds','hound',22,87,'Cheap flank/cap tag.'],['KG1','Khorngors','infantry',42,85,'Anti-large lane control.'],['KG2','Khorngors','infantry',58,85,'Anti-large lane control.'],['HAL','Chaos Warriors, Halberds','infantry',50,84,'Stable anti-large anchor.'],['MAR','Marauders of Khorne','light',50,88,'Cheap cap body.']],arrows:[[50,88,50,63],[35,88,26,58],[65,88,75,58]]},start:{title:'Start Phase',summary:'Get onto points and force Skaven screens to move. No hard dive until Bellower opens holes.',tokens:[['HB','Hellforged Bellowers','artillery',50,74,'Fire into screens/chaff around II.'],['MAR','Marauders of Khorne','light',51,60,'Cheap cap body on II.'],['HAL','Chaos Warriors, Halberds','infantry',47,60,'Hold II and deter vehicle dive.'],['KG1','Khorngors','infantry',26,56,'Contest I.'],['KG2','Khorngors','infantry',75,56,'Contest III.'],['ARB','Arbaal, Flesh Hound','lord',35,54,'Threaten exposed caster/guns.'],['KAR','Karanak','hero',66,54,'Threaten support. Save net/silence.'],['WH','Chaos Warhounds','hound',20,58,'Cap tag/chase only.'],['BT','Brazen queued','reserve',83,82,'Terror-collapse reserve.'],['FH','Flesh Hounds queued','reserve',17,82,'Bring after screens turn.'],['CK','Chaos Knights queued','reserve',31,82,'Durable fast cap/flank hammer.']],arrows:[[50,74,50,55],[35,54,25,45],[66,54,78,45],[51,60,51,54]]},dive:{title:'Dive Phase',summary:'After Bellower displaces screens, hit the exposed flank. Brazen and fast reserves collapse. Soul Grinder arrives late.',tokens:[['HB','Hellforged Bellowers','artillery',50,70,'Keep firing at screens and dense chaff.'],['HAL','Chaos Warriors, Halberds','infantry',49,58,'Hold central lane.'],['MAR','Marauders','light',52,62,'Cheap point/body duty.'],['KG1','Khorngors','infantry',30,53,'Anti-large left lane.'],['KG2','Khorngors','infantry',72,53,'Anti-large right lane.'],['ARB','Arbaal','lord',35,42,'Assassinate exposed support, then pull.'],['KAR','Karanak','hero',67,42,'Net/silence exposed caster.'],['WH','Warhounds','hound',18,47,'Chase routers/guns only.'],['BT','Knights of the Brazen Throne','terror',78,47,'Terror-collapse after fighting starts.'],['SG','Soul Grinder','monster',69,61,'Late second terror zone.'],['CK','Chaos Knights, Lances','cav',25,47,'Durable fast cap/flank hammer.'],['FH1','Flesh Hounds','hound',16,43,'Dive exposed guns/casters.'],['FH2','Flesh Hounds','hound',84,43,'Second dive angle.'],['FUR','Chaos Furies','flyer',58,38,'Emergency artillery/gun tag.'],['MH','Marauder Horsemen, Axes','skirmish',30,62,'Mobile AP into Doomwheel/Rat Ogres.'],['KGR','Khorngors reserve','infantry',74,58,'Extra anti-large support.'],['MR','Marauders reserve','light',54,66,'Cheap cap refresh.']],arrows:[[50,70,50,50],[25,47,17,38],[78,47,85,38],[67,42,78,35],[35,42,26,35],[69,61,72,46]]}};
const q=s=>document.querySelector(s),tokens=q('#tokens'),arrows=q('#arrows'),title=q('#phaseTitle'),summary=q('#phaseSummary'),list=q('#unitList');const px=(v,max)=>v*max/100;
function render(key){const p=phases[key];title.textContent=p.title;summary.textContent=p.summary;tokens.innerHTML='';list.innerHTML='';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.phase===key));arrows.querySelectorAll('.dyn').forEach(n=>n.remove());p.arrows.forEach(a=>{const x1=px(a[0],W),y1=px(a[1],H),x2=px(a[2],W),y2=px(a[3],H);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1},${y1} Q${(x1+x2)/2},${(y1+y2)/2-70} ${x2},${y2}`);path.setAttribute('class','arrow dyn');path.setAttribute('marker-end','url(#head)');arrows.appendChild(path)});p.tokens.forEach(u=>{const el=document.createElement('div');el.className=`token ${u[2]}`;el.style.setProperty('--x',u[3]);el.style.setProperty('--y',u[4]);el.textContent=u[0];el.dataset.name=u[1];el.dataset.note=u[5];tokens.appendChild(el);const row=document.createElement('div');row.className='unit';row.innerHTML=`<div class="mini ${u[2]}">${u[0]}</div><div><div class="name">${u[1]}</div><div class="note">${u[5]}</div></div>`;list.appendChild(row)})}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.phase)));render('deployment');
</script>
</body>
</html>
