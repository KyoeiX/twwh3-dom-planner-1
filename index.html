<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khorne vs Skaven Domination Planner</title>
<style>
:root{--panel:rgba(14,10,8,.91);--arrow:#6dff62;--text:#f7ead0;--muted:#cdbb9d;--red:#ff4438}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#32170d,transparent 38%),#080605;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.shell{width:min(1360px,96vw);margin:18px auto;display:grid;grid-template-columns:minmax(560px,1fr)340px;gap:14px}.top{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;align-items:end}h1{margin:0;font-size:clamp(22px,3vw,36px);line-height:1.05}.sub{margin-top:5px;color:var(--muted);font-size:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid rgba(230,187,104,.45);background:#1b120c;color:#f7e1bc;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}button.active,button:hover{background:#6d241f;color:#fff;border-color:#ffd37b}.map{position:relative;aspect-ratio:1086/1448;border:1px solid rgba(255,215,135,.42);border-radius:12px;overflow:hidden;background:#1b130b;box-shadow:0 18px 55px rgba(0,0,0,.5)}.map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.04) contrast(1.04)}.map::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(31,80,20,.08),transparent 22%,transparent 78%,rgba(129,31,23,.1));pointer-events:none;z-index:1}.cap{position:absolute;width:10.45%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.018);box-shadow:inset 0 0 18px rgba(255,255,255,.025);z-index:2;pointer-events:none}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}.arrow{fill:none;stroke:var(--arrow);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 11;filter:drop-shadow(0 2px 3px #000);opacity:.9}.token{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.72);font-size:9px;font-weight:900;color:#111;text-shadow:0 1px rgba(255,255,255,.35);box-shadow:0 4px 12px rgba(0,0,0,.72),inset 0 0 10px rgba(255,255,255,.16);cursor:help;z-index:5}.token::after{content:attr(data-name) "\A" attr(data-note);white-space:pre-line;position:absolute;left:50%;bottom:122%;transform:translateX(-50%);width:max-content;max-width:260px;opacity:0;background:rgba(5,4,3,.95);border:1px solid rgba(255,206,112,.4);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.25;text-align:left;color:#f7ead0;text-shadow:none;z-index:50;pointer-events:none}.token:hover{z-index:40;transform:translate(-50%,-50%) scale(1.14)}.token:hover::after{opacity:1}.lord,.hero{background:radial-gradient(circle at 35% 30%,#ffce78,#b83a23 68%,#4d0b06);color:#fff7df;text-shadow:0 1px 2px #000}.melee{background:radial-gradient(circle at 35% 30%,#ddff9a,#4d8b2a 68%,#172a0c)}.ranged{background:radial-gradient(circle at 35% 30%,#fff3aa,#d89a24 66%,#4c2b08)}.ror.melee{background:linear-gradient(90deg,#4d8b2a 0 50%,#8b41ce 50% 100%)}.ror.ranged{background:linear-gradient(90deg,#d89a24 0 50%,#8b41ce 50% 100%)}.ror.lord,.ror.hero{background:linear-gradient(90deg,#b83a23 0 50%,#8b41ce 50% 100%)}.reserve:not(.ror){background:rgba(70,70,70,.75);border-style:dashed}.diver{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,68,56,.22),0 4px 12px rgba(0,0,0,.72),inset 0 0 10px rgba(255,255,255,.16)}.panel{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;background:var(--panel);border:1px solid rgba(255,206,112,.28);border-radius:12px;padding:14px;height:max-content;box-shadow:0 16px 45px rgba(0,0,0,.35)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel h2{margin:0 0 8px;font-size:22px}.gear{width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:17px}.summary{font-size:13px;color:#dcc8aa;line-height:1.35;margin-bottom:12px}.unit{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding:7px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);margin-bottom:6px}.mini{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:900;border:1px solid rgba(255,255,255,.45);color:#111;text-shadow:0 1px rgba(255,255,255,.35)}.mini.lord,.mini.hero{color:#fff7df;text-shadow:0 1px 2px #000}.name{font-size:12px;font-weight:800}.note{font-size:11px;color:#c8b594}.settings{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}.settings.open{display:block}.settings h3{margin:0 0 8px;font-size:14px;color:#f7e1bc}.cap-row{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:center;margin-bottom:7px}.cap-row b{font-size:13px}.nudge{display:grid;grid-template-columns:24px 1fr 24px;gap:3px;align-items:center}.nudge button{border-radius:7px;padding:4px 0;font-size:12px}.nudge input{width:100%;background:#120c09;color:#f7ead0;border:1px solid rgba(255,206,112,.28);border-radius:7px;padding:5px;font-size:12px}.copy{width:100%;border-radius:9px;margin-top:5px}.foot{grid-column:1/-1;color:#bca989;font-size:12px}@media(max-width:950px){.shell{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.panel{position:static;order:-1}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div><h1>Khorne vs Skaven Domination Planner</h1><div class="sub">Army #1 Ver B: Bellower first, controlled assassin threat, dive after holes open.</div></div><div class="buttons"><button class="active" data-phase="deployment">Deployment</button><button data-phase="start">Start</button><button data-phase="dive">Dive</button></div></header><main class="map"><img class="map-img" src="dommap1.png" alt="Domination map" /><div class="cap i"></div><div class="cap ii"></div><div class="cap iii"></div><svg id="arrows" viewBox="0 0 1086 1448" preserveAspectRatio="none"><defs><marker id="head" markerWidth="18" markerHeight="18" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,6 L0,12 z" fill="rgba(109,255,98,.9)"></path></marker></defs></svg><div id="tokens"></div></main><aside class="panel"><div class="panel-head"><h2 id="phaseTitle"></h2><button id="gear" class="gear" title="Capture point settings">⚙</button></div><div id="phaseSummary" class="summary"></div><div id="unitList"></div><section id="settings" class="settings"><h3>Capture point nudge</h3><div id="capControls"></div><button id="copyCaps" class="copy">Copy capture values</button></section></aside><div class="foot">Keyboard: Left/Right cycles phase. Rule: pressure points early, punish screens with Bellowers, then dive exposed guns/casters.</div></div>
<script>
const W=1086,H=1448,phaseOrder=['deployment','start','dive'];let currentPhase='deployment';
const capDefaults={i:{x:23.4,y:51.6},ii:{x:50.4,y:51.6},iii:{x:76.3,y:51.6}};
let capState=JSON.parse(localStorage.getItem('capStateV3')||'null')||capDefaults;
function u(id,name,role,x,y,note,tx,ty){return{ id,name,role,x,y,note,tx,ty }}
const phases={deployment:{title:'Deployment Phase',summary:'Controlled pressure. Karanak hides in right forest. Chaff screens first, halberds behind, Bellower central.',tokens:[u('ARB','Arbaal, Flesh Hound','lord diver',35,88,'Left threat. Do not use as primary capper.',28,61),u('KAR','Karanak, Howl, no Foe-Seeker','hero diver',79,86,'Hidden right forest. Do not reveal the snipe plan early.',76,62),u('HB','Hellforged Bellowers','ranged ror',50,91,'Main-army screen punishment. RoR artillery.',50,74),u('WH','Chaos Warhounds','melee diver',22,87,'Cheap flank/cap tag.',23.4,54),u('MAR','Marauders of Khorne','melee',50,84,'Front cheap cap/chaff body.',50.4,58),u('KG1','Khorngors','melee',42,85,'Anti-large lane control.',23.4,54),u('KG2','Khorngors','melee',58,85,'Anti-large lane control.',50.4,56),u('HAL','Chaos Warriors, Halberds','melee',50,88,'Behind chaff, stable anti-large anchor.',47,60)]},start:{title:'Start Phase',summary:'Main force claims I and II. Warhounds only tag III if safe, then Chaos Knights take over as the safer fast cap unit.',tokens:[u('HB','Hellforged Bellowers','ranged ror',50,74,'Fire into screens/chaff around II. RoR artillery.',50,55),u('MAR','Marauders of Khorne','melee',50,58,'Cheap cap body on II.',50.4,51.6),u('HAL','Chaos Warriors, Halberds','melee',47,60,'Behind II cap body, anti-large anchor.',50,54),u('KG1','Khorngors','melee',23.4,54,'Contest or hold I.',23.4,51.6),u('KG2','Khorngors','melee',34,56,'Support I/II and punish large flank threats.',28,53),u('ARB','Arbaal, Flesh Hound','lord diver',35,58,'Threaten exposed caster/guns without sitting on cap.',25,45),u('KAR','Karanak hidden forest','hero diver',84,62,'Stay in forest until Bellower creates an opening.',78,45),u('WH','Chaos Warhounds','melee diver',76.3,54,'Fast tag III only. Leave if screened.',76.3,51.6),u('CK','Chaos Knights queued','melee diver reserve',82,82,'First reinforcement. Safer fast capper for III.',76.3,54),u('BT','Brazen queued','melee ror diver reserve',72,82,'Terror-collapse reserve after fighting starts.',78,49),u('FH','Flesh Hounds queued','melee diver reserve',17,82,'Bring after screens turn.',20,48)]},dive:{title:'Dive Phase',summary:'After Bellower displaces screens, hit the exposed flank. Karanak reveals from forest, Brazen and fast reserves collapse.',tokens:[u('HB','Hellforged Bellowers','ranged ror',50,70,'Keep firing at screens and dense chaff. RoR artillery.',50,50),u('HAL','Chaos Warriors, Halberds','melee',49,58,'Hold central lane.',50,54),u('MAR','Marauders','melee',52,62,'Cheap point/body duty.',50.4,51.6),u('KG1','Khorngors','melee',30,53,'Anti-large left lane.',27,45),u('KG2','Khorngors','melee',72,53,'Anti-large right lane.',76,47),u('ARB','Arbaal','lord diver',35,42,'Assassinate exposed support, then pull.',26,35),u('KAR','Karanak from forest','hero diver',75,44,'Reveal only when caster/support is exposed.',78,35),u('WH','Warhounds','melee diver',18,47,'Chase routers/guns only.',16,38),u('BT','Knights of the Brazen Throne','melee ror diver',78,47,'Terror-collapse after fighting starts.',85,38),u('SG','Soul Grinder','ranged',69,61,'Late second terror zone.',72,46),u('CK','Chaos Knights, Lances','melee diver',76.3,55,'Secure III or hammer exposed flank.',82,43),u('FH1','Flesh Hounds','melee diver',16,43,'Dive exposed guns/casters.',15,35),u('FH2','Flesh Hounds','melee diver',84,43,'Second dive angle.',88,35),u('FUR','Chaos Furies','melee diver',58,38,'Emergency artillery/gun tag.',58,31),u('MH','Marauder Horsemen, Axes','ranged',30,62,'Mobile AP into Doomwheel/Rat Ogres.',27,50),u('KGR','Khorngors reserve','melee',74,58,'Extra anti-large support.',76,51.6),u('MR','Marauders reserve','melee',54,66,'Cheap cap refresh.',52,58)]}};
const q=s=>document.querySelector(s),tokens=q('#tokens'),arrows=q('#arrows'),title=q('#phaseTitle'),summary=q('#phaseSummary'),list=q('#unitList'),settings=q('#settings'),capControls=q('#capControls');const px=(v,max)=>v*max/100;
function applyCaps(){Object.entries(capState).forEach(([k,v])=>{const el=q('.cap.'+k);if(el){el.style.left=v.x+'%';el.style.top=v.y+'%';}});localStorage.setItem('capStateV3',JSON.stringify(capState));}
function renderCapControls(){capControls.innerHTML='';['i','ii','iii'].forEach(k=>{const row=document.createElement('div');row.className='cap-row';row.innerHTML=`<b>${k.toUpperCase()}</b><div class="nudge"><button data-cap="${k}" data-axis="x" data-d="-0.1">−</button><input data-cap="${k}" data-axis="x" value="${capState[k].x.toFixed(1)}"><button data-cap="${k}" data-axis="x" data-d="0.1">+</button></div><div class="nudge"><button data-cap="${k}" data-axis="y" data-d="-0.1">−</button><input data-cap="${k}" data-axis="y" value="${capState[k].y.toFixed(1)}"><button data-cap="${k}" data-axis="y" data-d="0.1">+</button></div>`;capControls.appendChild(row)});capControls.querySelectorAll('button').forEach(b=>b.onclick=()=>{const c=b.dataset.cap,a=b.dataset.axis;capState[c][a]=+(capState[c][a]+Number(b.dataset.d)).toFixed(1);applyCaps();renderCapControls();});capControls.querySelectorAll('input').forEach(i=>i.onchange=()=>{capState[i.dataset.cap][i.dataset.axis]=+Number(i.value).toFixed(1);applyCaps();renderCapControls();});}
function drawArrow(t){if(t.tx==null||t.ty==null)return;const x1=px(t.x,W),y1=px(t.y,H),x2=px(t.tx,W),y2=px(t.ty,H);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1},${y1} Q${(x1+x2)/2},${(y1+y2)/2-70} ${x2},${y2}`);path.setAttribute('class','arrow dyn');path.setAttribute('marker-end','url(#head)');arrows.appendChild(path)}
function render(key){currentPhase=key;const p=phases[key];title.textContent=p.title;summary.textContent=p.summary;tokens.innerHTML='';list.innerHTML='';document.querySelectorAll('button[data-phase]').forEach(b=>b.classList.toggle('active',b.dataset.phase===key));arrows.querySelectorAll('.dyn').forEach(n=>n.remove());p.tokens.forEach(drawArrow);p.tokens.forEach(t=>{const el=document.createElement('div');el.className=`token ${t.role}`;el.style.setProperty('--x',t.x);el.style.setProperty('--y',t.y);el.textContent=t.id;el.dataset.name=t.name;el.dataset.note=t.note;tokens.appendChild(el);const row=document.createElement('div');row.className='unit';row.innerHTML=`<div class="mini ${t.role}">${t.id}</div><div><div class="name">${t.name}</div><div class="note">${t.note}</div></div>`;list.appendChild(row)});}
function cycle(dir){const i=phaseOrder.indexOf(currentPhase);render(phaseOrder[(i+dir+phaseOrder.length)%phaseOrder.length]);}
document.querySelectorAll('button[data-phase]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.phase)));document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1);});q('#gear').onclick=()=>{settings.classList.toggle('open');renderCapControls();};q('#copyCaps').onclick=async()=>{const text=JSON.stringify(capState,null,2);try{await navigator.clipboard.writeText(text);q('#copyCaps').textContent='Copied';setTimeout(()=>q('#copyCaps').textContent='Copy capture values',900)}catch{alert(text)}};applyCaps();renderCapControls();render('deployment');
</script>
</body>
</html>
